  function renderActivityMarkers(root, activities) {
    const sorted=activities.slice();
    sorted.forEach(function(activity){
      const coords=getActivityCoordinates(activity); if(!coords)return;
      const point=projectCoordinate(coords.lat,coords.lng);
      const selected=mapState.selectedActivityId===activity.id;
      const g=svgElement("g",{class:"marker"+(selected?" selected":""),transform:"translate("+point.x.toFixed(2)+" "+point.y.toFixed(2)+")","data-action":"map-marker","data-activity":activity.id,role:"button",tabindex:0,"aria-label":(activity.start||"Time TBD")+", "+activityLabel(activity)+", "+locationLabel(activity)});
      g.appendChild(svgElement("title",{},(activity.start||"Time TBD")+" · "+activityLabel(activity)+" · "+locationLabel(activity)));
      if(selected) {
        g.appendChild(svgElement("circle",{cx:0,cy:0,r:25,class:"marker-halo"}));

        appendMapText(root,point.x+15,point.y-10,activityLabel(activity),"marker-label");

  function drawBaseMap(root) {
    root.appendChild(svgElement("rect",{x:0,y:0,width:MAP_DIMENSIONS.width,height:MAP_DIMENSIONS.height,class:"water-bg"}));
    offlineMapData.water.forEach(function(shape){ root.appendChild(svgElement("path",{d:pathFromPoints(shape,true),class:"water-shape",style:state.mapLayers.roads?"":"display:none"})); });
    offlineMapData.land.forEach(function(shape,index){ root.appendChild(svgElement("path",{d:pathFromPoints(shape,true),class:"land"+(index?" secondary":"")})); });
    if(state.mapLayers.roads) offlineMapData.roads.forEach(function(road){
      root.appendChild(svgElement("path",{d:pathFromPoints(road.points,false),class:"road "+(road.type||"secondary")}));
      const midpoint=road.points[Math.floor(road.points.length/2)];
      if(midpoint && (mapState.zoom>=1.55||road.type==="primary") && state.mapLayers.labels){const p=projectCoordinate(midpoint[0],midpoint[1]);appendMapText(root,p.x+6,p.y-5,road.name,"road-label");}
    });
    if(state.mapLayers.rail) offlineMapData.railways.forEach(function(rail){root.appendChild(svgElement("path",{d:pathFromPoints(rail.points,false),class:"rail"}));});
    if(state.mapLayers.cities) offlineMapData.places.forEach(function(place){
      if(!place.important&&mapState.zoom<1.45)return;
      const p=projectCoordinate(place.lat,place.lng);
      root.appendChild(svgElement("circle",{cx:p.x,cy:p.y,r:place.important?4:3,class:"city-dot"}));
      if(state.mapLayers.labels)appendMapText(root,p.x+8,p.y-8,place.name,"city-label");
    });
  }

  function drawRoutes(root, activities) {
    if(!state.mapLayers.route)return;
    const byDay=new Map();
    activities.forEach(function(a){if(!byDay.has(a.day))byDay.set(a.day,[]);byDay.get(a.day).push(a);});
    let routeIndex=0;
    byDay.forEach(function(dayActivities){
      for(let i=0;i<dayActivities.length-1;i++){
        const from=dayActivities[i],to=dayActivities[i+1], ac=getActivityCoordinates(from),bc=getActivityCoordinates(to);
        if(!ac||!bc)continue;
        const ap=projectCoordinate(ac.lat,ac.lng),bp=projectCoordinate(bc.lat,bc.lng);
        const transport=from.transport||{}, selected=mapState.selectedRoute&&mapState.selectedRoute.fromId===from.id&&mapState.selectedRoute.toId===to.id;
        const route=svgElement("path",{d:"M"+ap.x.toFixed(2)+" "+ap.y.toFixed(2)+" L"+bp.x.toFixed(2)+" "+bp.y.toFixed(2),class:"route-line "+modeClass(transport.mode)+(selected?" selected":""),
          "data-action":"map-route","data-from":from.id,"data-next":to.id,"data-route-index":routeIndex,tabindex:0,role:"button","aria-label":"View route from "+activityLabel(from)+" to "+activityLabel(to)});
        if(selected) route.setAttribute("stroke-width","8");
        root.appendChild(route);
        if(mapState.zoom>=1.35 && state.mapLayers.labels && transport.mode){appendMapText(root,(ap.x+bp.x)/2+7,(ap.y+bp.y)/2-7,transport.mode+" · "+(transport.distance||"direct"),"route-label");}
        routeIndex++;
      }
    });
  }

  function renderOfflineMap(activities) {

  function copyText(value) {
    const text=String(value||"");
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    const area=document.createElement("textarea"); area.value=text; area.style.position="fixed"; area.style.opacity="0"; document.body.appendChild(area); area.focus(); area.select();
    let ok=false; try{ok=document.execCommand("copy");}catch(e){ok=false;} area.remove();
    return ok?Promise.resolve():Promise.reject(new Error("Clipboard unavailable"));
  }
  function copyMapsUrl(url) {

  }

  function previousNextActivity(id, direction) {
    const all=allActivities(), index=all.findIndex(function(a){return a.id===id});
    if(index<0)return;
    const nextIndex=index+direction;
    if(nextIndex<0||nextIndex>=all.length){showToast(direction<0?"This is the first stop.":"This is the last stop.");return;}
    openActivityModal(all[nextIndex].id);
  }

  function setView(view) {
    const next=["itinerary","map","places","overview","chat"].includes(view)?view:"itinerary";
    if(next==="chat"){ state.activeView=state.activeView==="chat"?"itinerary":state.activeView; openChat(); return; }
    state.activeView=next;
    state.overview=next==="overview";
    if(next==="map") {
      state.mapDay = state.selectedDay === "all" ? "all" : state.selectedDay;
      state.selectedDay = state.mapDay;
    }
    renderCurrentEnhancedView(next!=="overview" && next!=="places");
    updateMobileNav();
    if(next==="map"||next==="places") document.getElementById("map-stage").scrollIntoView({behavior:"smooth",block:"nearest"});
  }

  function updateMobileNav() {
    document.querySelectorAll("#mobile-bottom-nav [data-view]").forEach(function(btn){
      btn.classList.toggle("active",btn.getAttribute("data-view")===state.activeView);
    });
  }

  function toggleMapLayer(layer) {

  function highlightLocationByName(name) {
    const normalized=normalizeText(name);
    const match=allActivities().find(function(a){return normalizeText(a.location)===normalized || normalizeText(a.title).includes(normalized) || normalizeText(a.location).includes(normalized);});
    if(!match){showToast("That highlight is not in the offline itinerary data.");return;}
    state.selectedActivityId=match.id; mapState.selectedActivityId=match.id; state.activeView="map"; state.mapDay="all";
    renderCurrentEnhancedView(false);
    requestAnimationFrame(function(){centerMapOnActivity(match,3.4);});
  }

  /* Local chatbot ------------------------------------------------------ */
  function getPlaceContext(query) {
    const q=normalizeText(query);
    const places=placeActivities();
    let best=null,bestScore=-1;
    places.forEach(function(place){
      const text=normalizeText([place.title,place.city,place.country,place.type,(place.tags||[]).join(" ")].join(" "));
      let score=0;
      if(q===normalizeText(place.title))score+=100;
      if(text.includes(q))score+=40;
      q.split(" ").filter(Boolean).forEach(function(word){if(text.includes(word))score+=6;});
      if(score>bestScore){bestScore=score;best=place;}
    });
    return bestScore>0?best:null;
  }
  function getCountryContext(query) {
    const q=normalizeText(query);
    if(q.includes("singapore")||q.includes("singapor"))return {key:"singapore",data:countryKnowledge.singapore};
    if(q.includes("malaysia")||q.includes("malayxia")||q.includes("malaysia"))return {key:"malaysia",data:countryKnowledge.malaysia};
    return null;
  }
  function searchLocalKnowledge(query) {
    const q=normalizeText(query), tokens=q.split(" ").filter(Boolean);
    const results=[];
    allActivities().forEach(function(a){
      const hay=normalizeText([a.title,a.location,a.city,a.country,a.description,a.shortDescription,a.address,a.notes,a.type,(a.tags||[]).join(" "),(a.highlights||[]).join(" ")].join(" "));
      let score=0;
      if(hay===q)score+=100;
      if(hay.includes(q))score+=50;
      tokens.forEach(function(t){if(hay.includes(t))score+=8;});
      if(score>0)results.push({type:"activity",item:a,score:score});
    });
    ["singapore","malaysia"].forEach(function(key){
      const kb=countryKnowledge[key], hay=normalizeText(JSON.stringify(kb)); let score=0;
      if(hay.includes(q))score+=35; tokens.forEach(function(t){if(hay.includes(t))score+=4;});
      if(score>0)results.push({type:"country",item:{key:key,data:kb},score:score});
    });
    return results.sort(function(a,b){return b.score-a.score;});
  }

  function getIntent(query) {
    const q=normalizeText(query);
    if(/^\/day\s*[1-6]$/.test(q)||(/\bday\s*[1-6]\b/.test(q)&&/(what|plan|go|do|co|gi|ngay)/.test(q)))return "DAY_QUERY";
    if(q.includes("today")||q.includes("hom nay")||q.includes("currently")||q.includes("dang o"))return "DAY_QUERY";
    if(q.includes("next")||q.includes("tiep theo")||q.includes("ke tiep"))return "NEXT_PLACE";
    if(q.includes("previous")||q.includes("truoc")||q.includes("trước"))return "PREVIOUS_PLACE";
    if(q.includes("cost")||q.includes("tien")||q.includes("chi phi")||q.includes("expensive")||q.includes("dat nhat"))return "COST_QUERY";
    if(q.includes("how long")||q.includes("duration")||q.includes("bao lau")||q.includes("mat bao"))return "DURATION_QUERY";
    if(q.includes("transport")||q.includes("di bang")||q.includes("di gi")||q.includes("move"))return "TRANSPORT_QUERY";
    if(q.includes("map")||q.includes("ban do")||q.includes("show map"))return "MAP_QUERY";
    if(q.includes("google maps")||q.includes("maps"))return "MAPS_QUERY";
    if(q.includes("food")||q.includes("mon")||q.includes("an gi")||q.includes("eat"))return "FOOD_QUERY";
    if(q.includes("culture")||q.includes("van hoa")||q.includes("cultural"))return "CULTURE_QUERY";
    if(q.includes("where")||q.includes("o dau")||q.includes("address")||q.includes("dia chi"))return "PLACE_QUERY";
    if(q.includes("country")||q.includes("nuoc"))return "COUNTRY_QUERY";
    if(q.includes("city")||q.includes("thanh pho"))return "CITY_QUERY";
    if(q.includes("overview")||q.includes("summary")||q.includes("tong")||q.includes("trip"))return "TRIP_SUMMARY";
    if(q==="next"||q==="previous"||q==="overview"||q==="map"||/^\/day\s*[1-6]$/.test(q))return "COMMAND";
    return "SEARCH";
  }

  function dayFromQuery(query) {
    const q=normalizeText(query);
    const match=q.match(/(?:day|ngay)\s*([1-6])/);
    if(match)return Number(match[1]);
    if(q.includes("today")||q.includes("hom nay")||q.includes("dang o"))return state.selectedDay==="all"?1:Number(state.selectedDay);
    return null;
  }

  function daySummaryCard(day) {
    const s=calculateEnhancedSummary(day.activities);
    return '<div class="chat-card"><b>Day '+day.day+' · '+escapeHtml(day.title)+'</b><div style="color:var(--muted);font-size:.72rem;margin-top:2px">'+escapeHtml(day.location)+' · '+s.activities+' activities · '+escapeHtml(formatMinutes(s.activityMinutes))+' · '+escapeHtml(formatMoney(s.cost))+'</div>' +
      '<div style="margin-top:8px">'+day.activities.map(function(a){return '<div style="margin-top:5px"><b>'+escapeHtml(a.start||"")+'</b> · '+escapeHtml(locationLabel(a))+'</div>';}).join("")+'</div>' +
      '<div class="chat-actions"><button class="chat-action" type="button" data-action="chat-open-day" data-day="'+day.day+'">Open Day '+day.day+'</button></div></div>';
  }

  function placeChatCard(activity) {
    return '<div class="chat-card"><b>'+escapeHtml(activityLabel(activity))+'</b><div style="color:var(--muted);font-size:.72rem;margin-top:2px">Day '+activity.day+' · '+escapeHtml(activity.start||"Time TBD")+' · '+escapeHtml(activity.city||"")+'</div>' +
      '<div class="chat-actions"><button class="chat-action" type="button" data-action="chat-view-place" data-activity="'+escapeHtml(activity.id)+'">View Place</button><button class="chat-action" type="button" data-action="focus-place" data-activity="'+escapeHtml(activity.id)+'">Show on Map</button>'+(safeMapsUrl(activity.mapsUrl)?'<button class="chat-action" type="button" data-action="open-maps-preview" data-activity="'+escapeHtml(activity.id)+'">Google Maps</button>':"")+'</div></div>';
  }

  function generateLocalResponse(query) {
    const intent=getIntent(query), context=getTripContext(), q=normalizeText(query);
    if(intent==="COMMAND"){
      if(q==="overview"){return {text:"Opening the trip overview.",actions:[["Overview","nav-view","overview"]]}};
      if(q==="map"||q==="show map"){return {text:"Opening the offline map.",actions:[["Map","nav-view","map"]]}};
      if(q==="next"){return generateLocalResponse("next stop")};
      if(q==="previous"){return generateLocalResponse("previous stop")};
    }
    if(intent==="DAY_QUERY"){
      const n=dayFromQuery(query); const day=n?getDay(n):getDay(context.day?context.day.day:1);
      if(!day)return {text:"Mình chưa có ngày này trong dữ liệu offline."};
      return {text:"Đây là lịch của Day "+day.day+".",html:daySummaryCard(day)};
    }
    if(intent==="NEXT_PLACE"||intent==="PREVIOUS_PLACE"){
      const selected=context.selected || allActivities()[0];
      const idx=allActivities().findIndex(function(a){return a.id===selected.id;});
      const item=intent==="NEXT_PLACE"?allActivities()[idx+1]:allActivities()[idx-1];
      if(!item)return {text:intent==="NEXT_PLACE"?"Đây là điểm cuối của dữ liệu hiện tại.":"Đây là điểm đầu của dữ liệu hiện tại."};
      return {text:(intent==="NEXT_PLACE"?"Điểm tiếp theo":"Điểm trước đó")+" là "+activityLabel(item)+".",html:placeChatCard(item)};
    }
    if(intent==="MAP_QUERY")return {text:"Mình sẽ chuyển sang Map Mode và giữ toàn bộ dữ liệu offline.",actions:[["Show map","nav-view","map"]]};
    if(intent==="COST_QUERY"){
      if(q.includes("ngay")||q.includes("day")){
        const days=itinerary.map(function(day){return {day:day.day,cost:calculateEnhancedSummary(day.activities).cost};});
        const top=days.slice().sort(function(a,b){return b.cost-a.cost;})[0];
        return {text:"Ngày có chi phí hoạt động cao nhất là Day "+top.day+" với "+formatMoney(top.cost)+".",html:days.map(function(d){return '<div class="chat-card"><b>Day '+d.day+'</b><div style="color:var(--muted);font-size:.74rem">'+escapeHtml(formatMoney(d.cost))+'</div></div>';}).join("")};
      }
      return {text:"Tổng chi phí hoạt động được lưu trong itinerary là "+formatMoney(context.cost)+".",html:'<div class="chat-card"><b>Trip total</b><div style="color:var(--muted);font-size:.74rem">'+escapeHtml(formatMoney(context.cost))+'</div></div>'};
    }
    if(intent==="DURATION_QUERY")return {text:"Tổng thời gian hoạt động là "+formatMinutes(context.activityMinutes)+" và tổng thời gian transport là "+formatMinutes(context.transportMinutes)+"."};
    if(intent==="TRANSPORT_QUERY"){
      const n=dayFromQuery(query), list=(n?getDay(n).activities:context.day?context.day.activities:allActivities()).filter(function(a){return a.transport;});
      if(!list.length)return {text:"Mình chưa có transport detail phù hợp trong dữ liệu offline."};
      return {text:"Transport trong phần dữ liệu này:",html:list.map(function(a){return '<div class="chat-card"><b>'+escapeHtml(locationLabel(a))+'</b><div style="color:var(--muted);font-size:.74rem">'+transportIcon(a.transport.mode)+' '+escapeHtml(a.transport.mode)+' · '+escapeHtml(formatMinutes(a.transport.duration))+' · '+escapeHtml(a.transport.distance||"")+'</div></div>';}).join("")};
    }
    if(intent==="FOOD_QUERY"||intent==="CULTURE_QUERY"){
      const country=getCountryContext(q) || {key:"singapore",data:countryKnowledge.singapore};
      const data=country.data, arr=intent==="FOOD_QUERY"?data.food:data.culture;
      return {text:(country.key==="singapore"?"Singapore":"Malaysia")+" offline knowledge:",html:'<div class="chat-card"><b>'+escapeHtml(intent==="FOOD_QUERY"?"Food":"Culture")+'</b><div style="margin-top:7px">'+arr.map(function(x){return '• '+escapeHtml(x);}).join("<br>")+'</div></div>'};
    }
    if((q.includes("tips")||q.includes("practical")) && (q.includes("singapore")||q.includes("malaysia"))){
      const country=getCountryContext(q);
      if(country) return {text:(country.key==="singapore"?"Singapore":"Malaysia")+" · Offline tips",html:'<div class="chat-card"><b>Practical tips</b><div style="margin-top:7px">'+country.data.practicalTips.map(function(x){return '• '+escapeHtml(x);}).join("<br>")+'</div></div>'};
    }
    if(intent==="COUNTRY_QUERY"){
      const country=getCountryContext(q);
      if(!country)return {text:"Mình có offline reference cho Singapore và Malaysia. Hãy thử hỏi về một trong hai nước."};
      return {text:(country.key==="singapore"?"Singapore":"Malaysia")+" · Offline reference",html:'<div class="chat-card"><b>Overview</b><p style="margin:5px 0;color:var(--muted)">'+escapeHtml(country.data.overview)+'</p><b>Cities</b><p style="margin:3px 0">'+country.data.cities.map(escapeHtml).join(" · ")+'</p></div>'};
    }
    if(intent==="TRIP_SUMMARY")return {text:"Trip có "+context.days+" ngày, "+context.places+" places và "+context.activities+" activities. Activity time: "+formatMinutes(context.activityMinutes)+". Transport time: "+formatMinutes(context.transportMinutes)+".",html:'<div class="chat-card"><b>'+escapeHtml(tripInfo.title)+'</b><div style="margin-top:6px">Cost · '+escapeHtml(formatMoney(context.cost))+'</div><div>Activities · '+context.activities+'</div></div>'};
    const place=getPlaceContext(q);
    if(place){
      const a=place.selectedActivity;
      if(intent==="MAPS_QUERY")return {text:"Đây là destination có Google Maps link.",html:placeChatCard(a)};
      if(intent==="CITY_QUERY")return {text:activityLabel(a)+" nằm ở "+(a.city||"thành phố chưa có trong local data")+"." ,html:placeChatCard(a)};
      if(intent==="PLACE_QUERY" || q.includes("what") || q.includes("cho toi") || q.includes("co gi") || q.includes("whats")){
        let text=activityLabel(a)+" ở "+(a.city||"")+(a.country?", "+a.country:"")+".";
        if(a.address) text+=" Địa chỉ: "+a.address+".";
        if(a.bestTime) text+=" Best time lưu trong data: "+a.bestTime+".";
        if((a.highlights||[]).length) text+=" Highlights: "+a.highlights.join(", ")+".";
        return {text:text,html:placeChatCard(a)};
      }
    }
    const country=getCountryContext(q);
    if(country){
      const d=country.data;
      return {text:d.overview,html:'<div class="chat-card"><b>Offline knowledge</b><div style="margin-top:6px"><b>Food:</b> '+d.food.map(escapeHtml).join(", ")+'</div><div><b>Transport:</b> '+d.transport.map(escapeHtml).join(", ")+'</div><div><b>Culture:</b> '+d.culture.map(escapeHtml).join(", ")+'</div></div>'};
    }
    const results=searchLocalKnowledge(query).slice(0,3);
    if(results.length){
      const html=results.map(function(r){return r.type==="activity"?placeChatCard(r.item):'<div class="chat-card"><b>'+escapeHtml(r.item.key==="singapore"?"Singapore":"Malaysia")+'</b><div style="color:var(--muted);font-size:.73rem">Offline reference match</div></div>';}).join("");
      return {text:"Mình tìm thấy dữ liệu offline gần nhất:",html:html};
    }
    return {text:"Mình chưa có thông tin này trong dữ liệu offline hiện tại."};
  }

  function saveChatHistory() {
    try{localStorage.setItem("travel-chat-history",JSON.stringify(chatState.messages.slice(-80)));}catch(e){}
  }
  function loadChatHistory() {
    try{const raw=localStorage.getItem("travel-chat-history"); chatState.messages=raw?JSON.parse(raw):[];}catch(e){chatState.messages=[];}
  }
  function clearChatHistory(){chatState.messages=[];saveChatHistory();renderChat();}
  function renderChatMessage(message) {
    return '<div class="chat-bubble '+(message.role==="user"?"user":"assistant")+'"><div>'+escapeHtml(message.text||"")+'</div>'+(message.html||"")+(message.actions&&message.actions.length?'<div class="chat-actions">'+message.actions.map(function(a){return '<button class="chat-action" type="button" data-action="'+a[1]+'" data-view="'+escapeHtml(a[2]||"")+'">'+escapeHtml(a[0])+'</button>';}).join("")+'</div>':"")+'</div>';
  }
  function renderChat() {
    const drawer=document.getElementById("chat-drawer"); if(!drawer)return;
    drawer.innerHTML='<header class="chat-header"><div><div class="chat-title">Travel Companion</div><div class="chat-sub">Static local assistant · no network requests</div></div><div style="display:flex;gap:7px;align-items:center"><span class="chat-status">Local data</span><button class="icon-button" type="button" data-action="chat-clear" aria-label="Clear chat">⌫</button><button class="icon-button" type="button" data-action="chat-close" aria-label="Close chat">×</button></div></header>' +
      '<div class="chat-quick"><button class="chat-action" data-action="chat-prompt" data-prompt="Today\'s plan">Today\'s plan</button><button class="chat-action" data-action="chat-prompt" data-prompt="Next stop">Next stop</button><button class="chat-action" data-action="chat-prompt" data-prompt="Trip cost">Trip cost</button><button class="chat-action" data-action="chat-prompt" data-prompt="Singapore tips">Singapore tips</button><button class="chat-action" data-action="chat-prompt" data-prompt="Malaysia tips">Malaysia tips</button></div>' +
      '<div id="chat-messages" class="chat-messages">'+(chatState.messages.length?chatState.messages.map(renderChatMessage).join(""):'<div class="empty">Ask about your itinerary, a place, transport, cost or the local Singapore / Malaysia reference data.</div>')+'</div>' +
      '<form id="chat-form" class="chat-composer"><input id="chat-input" type="text" autocomplete="off" placeholder="Ask about your trip…"><button class="button primary" type="submit">Send</button></form>';
    drawer.querySelector("#chat-form").addEventListener("submit",function(e){e.preventDefault();const input=document.getElementById("chat-input");sendChatMessage(input.value);});
    const messages=document.getElementById("chat-messages"); messages.scrollTop=messages.scrollHeight;
  }
  function openChat() {
    const drawer=document.getElementById("chat-drawer"), overlay=document.getElementById("drawer-overlay");
    chatState.isOpen=true; drawer.hidden=false; overlay.hidden=false; renderChat();
    requestAnimationFrame(function(){const input=document.getElementById("chat-input");if(input)input.focus();});
  }
  function closeChat(){chatState.isOpen=false;document.getElementById("chat-drawer").hidden=true;document.getElementById("drawer-overlay").hidden=true;}
  function sendChatMessage(query) {
    const text=String(query||"").trim(); if(!text)return;
    const lower=normalizeText(text);
    if(lower.startsWith("/day ")){const n=Number(lower.replace("/day ",""));if(n>=1&&n<=itinerary.length){state.selectedDay=n;state.mapDay=n;state.activeView="itinerary";renderCurrentEnhancedView(true);}}
    if(lower==="overview"){state.activeView="overview";renderCurrentEnhancedView(false);}
    if(lower==="map"||lower==="show map"){state.activeView="map";renderCurrentEnhancedView(true);}
    if(lower==="next"){state.selectedActivityId=state.selectedActivityId||allActivities()[0].id;}
    const response=generateLocalResponse(text);
    chatState.messages.push({role:"user",text:text});
    chatState.messages.push({role:"assistant",text:response.text||"",html:response.html||"",actions:response.actions||[]});
    saveChatHistory(); renderChat();
  }

  /* Action routing for new controls. Existing event handling remains intact. */
  document.addEventListener("click",function(event){
    const control=event.target.closest("[data-action]"); if(!control)return;
    const action=control.getAttribute("data-action");

    if(action==="select-day"||action==="overview-day"){
      event.preventDefault(); event.stopImmediatePropagation();
      state.selectedDay=Number(control.getAttribute("data-day"));
      state.mapDay=state.selectedDay;
      state.activeView="itinerary"; state.overview=false;
      state.selectedActivityId=null; mapState.selectedActivityId=null;
      renderCurrentEnhancedView(true);
      return;
    }
    if(action==="overview"){
      event.preventDefault(); event.stopImmediatePropagation();
      state.activeView="overview"; state.overview=true; state.selectedDay="all";
      state.selectedActivityId=null; mapState.selectedActivityId=null;
      renderCurrentEnhancedView(false);
      return;
    }
    if(action==="theme"){
      event.preventDefault(); event.stopImmediatePropagation();
      toggleTheme(); return;
    }
    if(action==="clear-filters"){
      event.preventDefault(); event.stopImmediatePropagation();
      state.searchQuery=""; state.activityType="all"; state.transportType="all";
      state.selectedDay="all"; state.mapDay="all"; state.selectedActivityId=null; mapState.selectedActivityId=null;
      state.activeView="itinerary"; state.overview=false;
      renderCurrentEnhancedView(true); showToast("Filters cleared."); return;
    }
    if(action==="toggle-card"){
      event.preventDefault(); event.stopImmediatePropagation();
      const id=control.getAttribute("data-activity");
      if(state.expandedActivities.has(id))state.expandedActivities.delete(id); else state.expandedActivities.add(id);
      renderCurrentEnhancedView(false); return;
    }
    if(action==="nav-view"){event.preventDefault();setView(control.getAttribute("data-view"));return;}
    if(action==="chat-toggle"){openChat();return;}
    if(action==="chat-close"){closeChat();return;}
    if(action==="chat-close-overlay"){closeChat();return;}
    if(action==="chat-clear"){clearChatHistory();return;}
    if(action==="chat-prompt"){sendChatMessage(control.getAttribute("data-prompt")||"");return;}
    if(action==="chat-open-day"){const d=Number(control.getAttribute("data-day"));state.selectedDay=d;state.activeView="itinerary";closeChat();renderCurrentEnhancedView(true);return;}
    if(action==="chat-view-place"){const id=control.getAttribute("data-activity");closeChat();state.activeView="places";state.selectedActivityId=id;renderCurrentEnhancedView(false);return;}
    if(action==="open-maps-preview"){openMapsPreview(control.getAttribute("data-activity"));return;}
    if(action==="maps-open-external"){
      const a=getActivityById(control.getAttribute("data-activity")), url=safeMapsUrl(a&&a.mapsUrl);
      if(url)window.open(url,"_blank","noopener,noreferrer"); else showToast("No safe Google Maps link is available.");
      return;
    }
    if(action==="copy-maps-url"){copyMapsUrl(control.getAttribute("data-url")||"");return;}
    if(action==="copy-coordinates"){const a=getActivityById(control.getAttribute("data-activity"));const c=getActivityCoordinates(a);if(c)copyText(c.lat.toFixed(4)+", "+c.lng.toFixed(4)).then(function(){showToast("Coordinates copied.");}).catch(function(){showToast("Copy unavailable.");});return;}
    if(action==="place-select"||action==="focus-place"){const id=control.getAttribute("data-activity");state.selectedActivityId=id;mapState.selectedActivityId=id;focusPlaceOnMap(id);return;}
    if(action==="transport-details"){openTransportDetails(control.getAttribute("data-activity"));return;}
    if(action==="modal-previous"){previousNextActivity(control.getAttribute("data-activity"),-1);return;}
    if(action==="modal-next"){previousNextActivity(control.getAttribute("data-activity"),1);return;}
    if(action==="highlight"){highlightLocationByName(control.getAttribute("data-location")||"");return;}
    if(action==="map-select-day"){
      event.preventDefault(); event.stopImmediatePropagation();
      selectMapDay(control.getAttribute("data-day") || "all");
      return;

    svg.addEventListener("pointerdown",function(event){
      if(event.target.closest&&event.target.closest("[data-action]"))return;

      runtime.mapPointers.set(event.pointerId,{clientX:event.clientX,clientY:event.clientY});runtime.panMoved=false;
      if(runtime.mapPointers.size===1)runtime.mapGesture={last:mapPointFromEvent(event)};
      else if(runtime.mapPointers.size===2)runtime.mapGesture={distance:pointerDistance(),midpoint:pointerMidpoint()};

      if(runtime.mapPointers.size===1&&runtime.mapGesture&&runtime.mapGesture.last){
        const current=mapPointFromEvent(event),last=runtime.mapGesture.last;

        mapState.offsetX+=current.x-last.x;mapState.offsetY+=current.y-last.y;runtime.mapGesture.last=current;scheduleMapTransform();
      } else if(runtime.mapPointers.size===2&&runtime.mapGesture&&runtime.mapGesture.distance){
        const distance=pointerDistance(),midpoint=pointerMidpoint(); if(distance>0)zoomMap(distance/runtime.mapGesture.distance,mapPointFromEvent(midpoint));

    function haversineKm(a,b){
      if(!a||!b||!isValidCoordinate(Number(a.lat),Number(a.lng))||!isValidCoordinate(Number(b.lat),Number(b.lng)))return null;
      const r=6371,rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLng=(b.lng-a.lng)*rad;
      const h=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
      return 2*r*Math.asin(Math.min(1,Math.sqrt(h)));
    }

        const b=day.activities[index+1],ac=getActivityCoordinates(a),bc=getActivityCoordinates(b),km=haversineKm(ac,bc);
        if(km!==null && parseDistanceKm(a.transport.distance)!==null){ a.transport.distance=(km<1?(km*1000).toFixed(0)+" m":km.toFixed(1)+" km"); }
      });
    }

  /* =========================================================
     FINAL MAPLIBRE + HUGGING FACE MBTILES ADAPTER
     ---------------------------------------------------------
     - Uses the public Hugging Face Bucket object as the single map archive.
     - Uses SQL.js to read the SQLite/MBTiles container.
     - Converts MBTiles TMS rows to XYZ rows for MapLibre.
     - Supports vector MBTiles and raster MBTiles.

  (function installMapLibreMbtilesAdapter(){
    "use strict";

    const OFFLINE_MAP_URL = "https://huggingface.co/buckets/hacervietnam/holiday/resolve/map.mbtiles";
    const OFFLINE_MAP_CACHE = "itinerary-offline-map-v3-hf";

    let vectorLayerMetadata = [];
    let offlineStyleLayerIds = [];
    let offlinePointLayerIds = [];
    let offlineLineLayerIds = [];

    function mapHost(){ return document.getElementById("offline-map"); }

    function ensureStatus(){

        el = document.createElement("div");

    }

    function setMapStatus(message, isError){

    function clearMapStatus(){

    }

    function coordsOf(activity){ return getActivityCoordinates(activity); }

    function validateAllCoordinates(){
      let invalid = 0;
      allActivities().forEach(function(activity){
        const raw = activity && activity.coordinates;
        if(!raw) return;
        const lat = Number(raw.lat), lng = Number(raw.lng);
        if(!isValidCoordinate(lat, lng)){

        }
      });
      if(invalid) throw new Error("Invalid itinerary coordinates detected. See console.");
    }

    function readMetadata(database){
      const out = {};
      try{
        const rows = database.exec("SELECT name, value FROM metadata");
        if(rows && rows[0]){
          const cols = rows[0].columns;
          rows[0].values.forEach(function(row){ out[String(row[0])] = String(row[1] == null ? "" : row[1]); });
        }
      }catch(e){
        console.warn("[Offline Map] No readable metadata table:", e);
      }
      return out;
    }

    function parseVectorLayerMetadata(metadata){
      const candidates = [metadata.json, metadata["json"]];
      for(let i=0;i<candidates.length;i++){
        if(!candidates[i]) continue;
        try{
          const parsed = typeof candidates[i] === "string" ? JSON.parse(candidates[i]) : candidates[i];
          if(Array.isArray(parsed.vector_layers)) return parsed.vector_layers;
        }catch(e){
          console.warn("[Offline Map] Could not parse metadata.json:", e);
        }
      }
      return [];
    }

    function getMetadataBounds(metadata){
      if(!metadata.bounds) return null;
      const nums = String(metadata.bounds).split(",").map(Number);
      if(nums.length !== 4 || nums.some(function(v){return !Number.isFinite(v);})) return null;
      return nums;
    }

    function getMetadataCenter(metadata){
      if(!metadata.center) return null;
      const nums = String(metadata.center).split(",").map(Number);
      if(nums.length < 2 || nums.slice(0,2).some(function(v){return !Number.isFinite(v);})) return null;
      return { lng:nums[0], lat:nums[1], zoom:Number.isFinite(nums[2]) ? nums[2] : null };
    }

    function detectFormat(metadata, firstTile){
      const declared = String(metadata.format || metadata.type || "").toLowerCase();
      if(declared.includes("png") || declared.includes("jpg") || declared.includes("jpeg") || declared.includes("webp") || declared.includes("avif") || declared.includes("raster")) return "raster";
      if(declared.includes("pbf") || declared.includes("mvt") || declared.includes("vector")) return "pbf";
      if(firstTile && firstTile.length >= 8){
        const b=firstTile;
        if(b[0]===0x89 && b[1]===0x50 && b[2]===0x4e && b[3]===0x47) return "raster";
        if(b[0]===0xff && b[1]===0xd8) return "raster";
        if(b[0]===0x52 && b[1]===0x49 && b[2]===0x46 && b[3]===0x46) return "raster";
      }
      return "pbf";
    }

    function getRasterMime(format){
      switch(String(format||"").toLowerCase()){
        case "png": return "image/png";
        case "jpg":
        case "jpeg": return "image/jpeg";
        case "webp": return "image/webp";
        case "avif": return "image/avif";
        default: return "image/png";
      }
    }

    async function maybeGunzip(data){
      if(!data || data.length < 2 || data[0] !== 0x1f || data[1] !== 0x8b) return data;
      if(typeof DecompressionStream === "undefined"){
        throw new Error("This vector tile is gzip-compressed, but this browser does not expose DecompressionStream.");
      }
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function tileRowToTms(z, y){
      return (1 << Number(z)) - 1 - Number(y);
    }

    function queryTile(z,x,y){
      if(!db) return null;
      const tmsY = tileRowToTms(z,y);
      const stmt = db.prepare("SELECT tile_data FROM tiles WHERE zoom_level = $z AND tile_column = $x AND tile_row = $y LIMIT 1");
      try{
        stmt.bind({$z:Number(z),$x:Number(x),$y:Number(tmsY)});
        if(!stmt.step()) return null;
        const row = stmt.getAsObject();
        return row && row.tile_data ? new Uint8Array(row.tile_data) : null;
      }finally{ stmt.free(); }
    }

    async function loadMbtiles(){
      setMapStatus("Loading offline map…", false);

      async function cacheGet(){
        try{
          if(window.caches){
            const cache=await caches.open(OFFLINE_MAP_CACHE);
            return await cache.match(OFFLINE_MAP_URL);
          }
        }catch(e){ console.warn("[Offline Map] Cache lookup failed:",e); }
        return null;
      }

      async function cachePut(response){
        try{
          if(window.caches){
            const cache=await caches.open(OFFLINE_MAP_CACHE);
            await cache.put(OFFLINE_MAP_URL,response.clone());
          }
        }catch(e){ console.warn("[Offline Map] Cache save failed:",e); }
      }

      // Cached complete archive: fastest possible path on repeat visits.
      let response=await cacheGet();
      if(response){
        const cachedLength=Number(response.headers.get("content-length")||0);
        if(cachedLength) setMapStatus("Using cached map · "+Math.round(cachedLength/1048576)+" MB",false);
      }

      // First visit: use parallel HTTP Range requests when the server/CDN supports them.
      // This keeps the exact MBTiles file and SQL.js pipeline, but avoids relying on one
      // long single connection for the whole archive. Hugging Face supports byte ranges.
      if(!response){
        const RANGE_CHUNK=8*1024*1024;
        const CONCURRENCY=6;
        let total=0;
        let ranged=true;
        try{
          const probe=await fetch(OFFLINE_MAP_URL,{method:"GET",headers:{"Range":"bytes=0-0"},cache:"no-store",credentials:"omit"});
          const contentRange=probe.headers.get("content-range")||"";
          const acceptRanges=probe.headers.get("accept-ranges")||"";
          const m=contentRange.match(/\/([0-9]+)$/);
          total=m?Number(m[1]):0;
          ranged=probe.status===206 && total>1 && (/bytes/i.test(acceptRanges)||contentRange);
          try{ await probe.body?.cancel(); }catch(_e){}
        }catch(e){
          ranged=false;
          console.warn("[Offline Map] Range probe failed, falling back to normal download:",e);
        }

        if(ranged){
          const parts=new Array(Math.ceil(total/RANGE_CHUNK));
          let nextPart=0;
          let downloaded=0;
          setMapStatus("Downloading map · 0%",false);
          async function worker(){
            while(true){
              const i=nextPart++;
              if(i>=parts.length)return;
              const startByte=i*RANGE_CHUNK;
              const endByte=Math.min(total-1,startByte+RANGE_CHUNK-1);
              let lastError=null;
              for(let attempt=0;attempt<3;attempt++){
                try{
                  const r=await fetch(OFFLINE_MAP_URL,{headers:{"Range":"bytes="+startByte+"-"+endByte},cache:"no-store",credentials:"omit"});
                  if(r.status!==206) throw new Error("Range request returned HTTP "+r.status);
                  const b=await r.arrayBuffer();
                  const expected=endByte-startByte+1;
                  if(b.byteLength!==expected) throw new Error("Range length mismatch for bytes "+startByte+"-"+endByte);
                  parts[i]=new Uint8Array(b);
                  downloaded+=b.byteLength;
                  setMapStatus("Downloading map · "+Math.min(100,Math.round(downloaded/total*100))+"%",false);
                  lastError=null;
                  break;
                }catch(e){
                  lastError=e;
                  await new Promise(r=>setTimeout(r,250*(attempt+1)));
                }
              }
              if(lastError) throw lastError;
            }
          }
          await Promise.all(Array.from({length:Math.min(CONCURRENCY,parts.length)},worker));
          const whole=new Uint8Array(total);
          let offset=0;
          for(const part of parts){ whole.set(part,offset); offset+=part.byteLength; }
          response=new Response(whole,{status:200,headers:{"Content-Type":"application/octet-stream","Content-Length":String(total)}});
          await cachePut(response);
        }else{
          response=await fetch(OFFLINE_MAP_URL,{cache:"force-cache",credentials:"omit"});
          if(!response.ok) throw new Error("HTTP "+response.status+" while loading "+OFFLINE_MAP_URL);
          await cachePut(response);
        }
      }

      const contentLength=Number(response.headers.get("content-length")||0);
      if(contentLength) setMapStatus("Reading map · "+Math.round(contentLength/1048576)+" MB",false);
      const buffer=await response.arrayBuffer();
      if(!buffer || buffer.byteLength<16) throw new Error("MBTiles file is empty or too small.");
      if(buffer.byteLength>1024*1024*1024) console.warn("[Offline Map] Large MBTiles file:",buffer.byteLength);

      if(typeof initSqlJs!=="function") throw new Error("SQL.js failed to load. Check the browser connection and the SQL.js CDN.");
      const SQL=await initSqlJs({locateFile:function(file){return "https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/"+file;}});
      db=new SQL.Database(new Uint8Array(buffer));
      lastMetadata=readMetadata(db);

      const countResult=db.exec("SELECT COUNT(*) AS c FROM tiles");
      const tileCount=countResult&&countResult[0]?Number(countResult[0].values[0][0]):0;
      if(!tileCount) throw new Error("The MBTiles database contains no tiles.");

      const first=db.exec("SELECT zoom_level, tile_column, tile_row, tile_data FROM tiles ORDER BY zoom_level LIMIT 1");
      const firstTile=first&&first[0]&&first[0].values[0]?new Uint8Array(first[0].values[0][3]):null;
      mbtilesFormat=detectFormat(lastMetadata,firstTile);
      vectorLayerMetadata=parseVectorLayerMetadata(lastMetadata);

      console.info("[Offline Map] MBTiles loaded",{
        bytes:buffer.byteLength,tiles:tileCount,format:mbtilesFormat,
        minzoom:lastMetadata.minzoom,maxzoom:lastMetadata.maxzoom,
        bounds:lastMetadata.bounds,center:lastMetadata.center,
        vectorLayers:vectorLayerMetadata.map(function(v){return v.id;})
      });
    }

    function chooseBaseLayerKind(id){
      const key = String(id || "").toLowerCase();
      if(/water|ocean|sea|lake|river|waterway/.test(key)) return "water";
      if(/park|landuse|landcover|natural|wood|forest|grass|garden|recreation/.test(key)) return "land";
      if(/building|structure/.test(key)) return "building";
      if(/rail|transit|subway|metro|train/.test(key)) return "rail";
      if(/road|transportation|highway|street|motorway|major_road/.test(key)) return "road";
      if(/boundary|admin|border/.test(key)) return "boundary";
      if(/place|poi|aeroway|airport|station/.test(key)) return "point";
      return "other";
    }

    function appendVectorLayers(style){
      offlineStyleLayerIds = [];
      offlinePointLayerIds = [];
      offlineLineLayerIds = [];
      if(!vectorLayerMetadata.length){
        console.warn("[Offline Map] MBTiles has no vector_layers metadata. Roads may be unavailable unless metadata.json exists.");
        return;
      }
      vectorLayerMetadata.forEach(function(meta,index){
        const sourceLayer = String(meta.id || "");
        if(!sourceLayer) return;
        const kind = chooseBaseLayerKind(sourceLayer);
        const safeId = ("offline-" + sourceLayer).replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,80) + "-" + index;

        if(kind === "water" || kind === "land" || kind === "building"){
          const fillId = safeId + "-fill";
          const fillColor = kind === "water" ? "#c7e7f5" : (kind === "land" ? "#f1efdf" : "#deddd7");
          style.layers.push({id:fillId,type:"fill",source:"offline-vector","source-layer":sourceLayer,filter:["==",["geometry-type"],"Polygon"],paint:{"fill-color":fillColor,"fill-opacity":kind === "building" ? 0.72 : 0.88}});
          offlineStyleLayerIds.push(fillId);
        }

        if(kind === "road" || kind === "rail" || kind === "boundary" || kind === "other"){
          const lineId = safeId + "-line";
          const paint = kind === "road" ? {
            "line-color":"#d0b06f","line-opacity":0.95,
            "line-width":["interpolate",["linear"],["zoom"],6,0.6,10,1.2,13,2.2,16,4.2,18,6]
          } : {
            "line-color":kind === "rail" ? "#cf83c9" : "#a2a9ad",
            "line-opacity":kind === "boundary" ? 0.55 : 0.82,
            "line-width":kind === "rail" ? 2.2 : 1.1
          };
          style.layers.push({id:lineId,type:"line",source:"offline-vector","source-layer":sourceLayer,filter:["==",["geometry-type"],"LineString"],paint:paint,layout:{"line-cap":"round","line-join":"round"}});
          offlineStyleLayerIds.push(lineId);
          offlineLineLayerIds.push(lineId);
        }

        if(kind === "point"){
          const circleId = safeId + "-points";
          style.layers.push({id:circleId,type:"circle",source:"offline-vector","source-layer":sourceLayer,filter:["==",["geometry-type"],"Point"],paint:{"circle-color":"#657786","circle-radius":["interpolate",["linear"],["zoom"],7,1.2,12,2.4,16,3.4],"circle-opacity":0.7}});
          offlineStyleLayerIds.push(circleId);
          offlinePointLayerIds.push(circleId);
        }
      });
    }

    function buildStyle(){
      const minzoom = Number(lastMetadata.minzoom || 0);
      const maxzoom = Number(lastMetadata.maxzoom || 22);
      const bounds = getMetadataBounds(lastMetadata);
      if(mbtilesFormat === "raster"){
        return {
          version:8,
          name:"Local Offline MBTiles",
          sources:{
            "offline-raster":{
              type:"raster",
              tiles:["mbtiles://{z}/{x}/{y}"],
              tileSize:Number(lastMetadata.tile_size || 256),
              minzoom:minzoom,
              maxzoom:maxzoom,
              ...(bounds ? {bounds:bounds} : {})
            }
          },
          layers:[{id:"offline-raster-layer",type:"raster",source:"offline-raster",paint:{"raster-opacity":1}}]
        };
      }
      const style={
        version:8,
        name:"Local Offline Vector MBTiles",
        sources:{"offline-vector":{type:"vector",tiles:["mbtiles://{z}/{x}/{y}"],minzoom:minzoom,maxzoom:maxzoom,...(bounds ? {bounds:bounds} : {})}},
        layers:[{id:"offline-background",type:"background",paint:{"background-color":"#dbeef7"}}]
      };
      appendVectorLayers(style);
      return style;
    }

    function installMbtilesProtocol(){
      maplibregl.addProtocol("mbtiles", async function(params){
        const match = String(params.url).match(/^mbtiles:\/\/(-?\d+)\/(-?\d+)\/(-?\d+)$/);
        if(!match) return {data:null};
        const z=Number(match[1]), x=Number(match[2]), y=Number(match[3]);
        try{
          let data=queryTile(z,x,y);
          if(!data) return {data:null};
          if(mbtilesFormat === "pbf") data=await maybeGunzip(data);
          return {data:data};
        }catch(error){
          console.error("[Offline Map] Tile read failed",{z:z,x:x,y:y,error:error});
          throw error;
        }
      });
    }

    function tileUrlTemplate(){ return "mbtiles://{z}/{x}/{y}"; }

    function ensureRouteLayers(){
      if(!mlMap || !mlMap.isStyleLoaded()) return;
      if(!mlMap.getSource(ROUTE_SOURCE_ID)){
        mlMap.addSource(ROUTE_SOURCE_ID,{type:"geojson",data:{type:"FeatureCollection",features:[]}});
      }
      if(!mlMap.getLayer(ROUTE_LAYER_ID)){
        mlMap.addLayer({id:ROUTE_LAYER_ID,type:"line",source:ROUTE_SOURCE_ID,layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":["match",["get","mode"],"walking","#6256e8","mrt","#e457b8","train","#e457b8","bus","#f59e0b","grab","#22a67b","taxi","#22a67b","car","#22a67b","#6256e8"],"line-width":4.6,"line-opacity":0.95}});
      }
      if(!mlMap.getLayer(ROUTE_SELECTED_LAYER_ID)){
        mlMap.addLayer({id:ROUTE_SELECTED_LAYER_ID,type:"line",source:ROUTE_SOURCE_ID,filter:["==",["get","selected"],true],layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#f05a7d","line-width":7,"line-opacity":0.92}});
      }
    }

    function routeGeoJson(activities){
      const features=[]; const byDay=new Map();
      (activities||[]).forEach(function(a){ if(!byDay.has(a.day)) byDay.set(a.day,[]); byDay.get(a.day).push(a); });
      let routeIndex=0;
      byDay.forEach(function(dayActivities){
        for(let i=0;i<dayActivities.length-1;i++){
          const from=dayActivities[i], to=dayActivities[i+1], a=coordsOf(from), b=coordsOf(to);
          if(!a || !b) continue;
          const transport=from.transport||{};
          features.push({type:"Feature",properties:{fromId:from.id,toId:to.id,day:from.day,routeIndex:routeIndex++,mode:modeClass(transport.mode),distance:transport.distance||"direct",selected:!!(mapState.selectedRoute && mapState.selectedRoute.fromId===from.id && mapState.selectedRoute.toId===to.id)},geometry:{type:"LineString",coordinates:[[Number(a.lng),Number(a.lat)],[Number(b.lng),Number(b.lat)]]}});
        }
      });
      return {type:"FeatureCollection",features:features};
    }

    function updateRoutes(activities){
      if(!mlMap || !mapReady) return;
      ensureRouteLayers();
      const source=mlMap.getSource(ROUTE_SOURCE_ID);
      if(source) source.setData(routeGeoJson(activities));
      updateLayerVisibility();
    }

    function destroyMarkers(){
      markerInstances.forEach(function(item){try{item.marker.remove();}catch(e){}});
      markerInstances=[];
    }

    function markerElement(activity){
      const el=document.createElement("button");
      el.type="button"; el.className="offline-map-marker"; el.setAttribute("data-action","map-marker"); el.setAttribute("data-activity",activity.id);
      el.setAttribute("aria-label",(activity.start||"Time TBD") + ", " + activityLabel(activity) + ", " + locationLabel(activity));
      el.innerHTML='<span class="offline-map-marker-core">'+escapeHtml(activity.sequence||1)+'</span>'+(state.mapLayers.labels?'<span class="offline-map-marker-label">'+escapeHtml(activityLabel(activity))+'<span>D'+escapeHtml(activity.day||"?")+' · '+escapeHtml(activity.start||"Time TBD")+' · '+escapeHtml(locationLabel(activity))+'</span></span>':"");
      return el;
    }

    function popupHtml(activity){
      const safeExternal=safeMapsUrl(activity.mapsUrl);
      const buttonMap=safeExternal?'<button type="button" data-action="map-open-external" data-activity="'+escapeHtml(activity.id)+'">Google Maps ↗</button>':"";
      const buttonFocus='<button type="button" data-action="focus-place" data-activity="'+escapeHtml(activity.id)+'">Focus</button>';
      const stopText='Day '+escapeHtml(activity.day||"?")+' · Stop '+escapeHtml(activity.sequence||"?");
      const transport=activity.transport&&activity.transport.mode?'<div class="popup-meta">↗ '+escapeHtml(activity.transport.mode)+(activity.transport.duration?' · '+escapeHtml(formatMinutes(activity.transport.duration)):'')+(activity.transport.distance?' · '+escapeHtml(activity.transport.distance):'')+'</div>':"";
      return '<div class="offline-popup"><strong>'+escapeHtml(activityLabel(activity))+'</strong><div class="popup-meta">'+escapeHtml(stopText)+(activity.start?' · '+escapeHtml(activity.start):'')+'</div><div class="popup-meta">⌖ '+escapeHtml(locationLabel(activity))+'</div>'+transport+'<div class="popup-actions">'+buttonMap+buttonFocus+'</div></div>';
    }

    function openActivityPopup(activity){
      if(!mlMap || !activity) return;
      const c=coordsOf(activity); if(!c) return;
      if(activePopup){try{activePopup.remove();}catch(e){} activePopup=null;}
      activePopup=new maplibregl.Popup({closeButton:true,closeOnClick:true,offset:18,maxWidth:"310px"}).setLngLat([c.lng,c.lat]).setHTML(popupHtml(activity)).addTo(mlMap);
    }

    function renderMarkers(activities){
      if(!mlMap || !mapReady) return;
      destroyMarkers();
      (activities||[]).filter(function(a){return !!coordsOf(a);}).forEach(function(activity){
        const el=markerElement(activity), c=coordsOf(activity);
        const marker=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([Number(c.lng),Number(c.lat)]).addTo(mlMap);
        el.addEventListener("click",function(event){
          event.stopPropagation();
          state.selectedActivityId=activity.id; mapState.selectedActivityId=activity.id;
          if(typeof selectActivity === "function") selectActivity(activity.id,true);
          requestAnimationFrame(function(){openActivityPopup(getActivityById(activity.id)||activity);});
        });
        markerInstances.push({id:activity.id,marker:marker,element:el,activity:activity});
      });
      syncSelectedMarker();
    }

    function syncSelectedMarker(){
      const id=mapState.selectedActivityId||state.selectedActivityId;
      markerInstances.forEach(function(item){item.element.classList.toggle("selected",item.id===id);});
    }

    function ensureLabelLayer(){
      const host=mapHost(); if(!host) return null;
      let layer=document.getElementById(MAP_LABEL_LAYER_ID);
      if(!layer){layer=document.createElement("div");layer.id=MAP_LABEL_LAYER_ID;host.appendChild(layer);}
      return layer;
    }

    function clearOverlayLabels(){const layer=document.getElementById(MAP_LABEL_LAYER_ID);if(layer)layer.replaceChildren();}

    function getFeatureName(feature){
      const p=feature&&feature.properties||{};
      const candidates=["name:en","name_en","name","int_name","official_name","ref"];
      for(let i=0;i<candidates.length;i++){const v=p[candidates[i]];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim();}
      return "";
    }

    function midpointCoordinate(geometry){
      if(!geometry) return null; const c=geometry.coordinates;
      if(geometry.type==="Point"&&Array.isArray(c))return c;
      if(geometry.type==="MultiPoint"&&Array.isArray(c)&&c[0])return c[0];
      if(geometry.type==="LineString"&&Array.isArray(c)&&c.length)return c[Math.floor(c.length/2)];
      if(geometry.type==="MultiLineString"&&Array.isArray(c)&&c[0]&&c[0].length){const l=c[0];return l[Math.floor(l.length/2)];}
      return null;
    }

    function addOverlayLabel(layer,text,lngLat,className){
      if(!lngLat||lngLat.length<2) return;
      const point=mlMap.project([Number(lngLat[0]),Number(lngLat[1])]);
      if(!Number.isFinite(point.x)||!Number.isFinite(point.y)) return;
      const span=document.createElement("span");span.className=className||"offline-feature-label";span.textContent=text;span.style.left=point.x+"px";span.style.top=point.y+"px";layer.appendChild(span);
    }

    function updateOverlayLabels(){
      if(!mlMap||!mapReady) return;
      clearOverlayLabels();
      if(!state.mapLayers.labels) return;
      const layer=ensureLabelLayer();if(!layer)return;
      if(state.mapLayers.cities && Array.isArray(offlineMapData&&offlineMapData.places)){
        offlineMapData.places.forEach(function(place){
          if(!place||!place.name||!isValidCoordinate(Number(place.lat),Number(place.lng)))return;
          if(!place.important&&mlMap.getZoom()<9)return;
          addOverlayLabel(layer,place.name,[place.lng,place.lat],"offline-city-label");
        });
      }
      const queriedLayers=offlinePointLayerIds.concat(offlineLineLayerIds);
      if(queriedLayers.length&&mlMap.getZoom()>=9){
        try{
          const features=mlMap.queryRenderedFeatures({layers:queriedLayers}),seen=new Set();let count=0;
          features.forEach(function(feature){
            if(count>=100)return;
            const name=getFeatureName(feature),coord=midpointCoordinate(feature.geometry);if(!name||!coord)return;
            const key=name+"|"+Number(coord[0]).toFixed(4)+"|"+Number(coord[1]).toFixed(4);if(seen.has(key))return;seen.add(key);
            addOverlayLabel(layer,name,coord,"offline-feature-label");count++;
          });
        }catch(e){console.debug("[Offline Map] feature-label query skipped:",e);}
      }
    }

    function updateLayerVisibility(){
      if(!mlMap||!mlMap.getStyle()) return;
      offlineStyleLayerIds.forEach(function(id){
        const l=mlMap.getLayer(id);if(!l)return;const kind=chooseBaseLayerKind(String(l["source-layer"]||""));let visible=true;
        if(kind==="road"&&!state.mapLayers.roads)visible=false;
        if(kind==="rail"&&!state.mapLayers.rail)visible=false;
        if(kind==="point"&&!state.mapLayers.places)visible=false;
        if(kind==="boundary"&&!state.mapLayers.labels)visible=false;
        mlMap.setLayoutProperty(id,"visibility",visible?"visible":"none");
      });
      if(mlMap.getLayer(ROUTE_LAYER_ID))mlMap.setLayoutProperty(ROUTE_LAYER_ID,"visibility",state.mapLayers.route?"visible":"none");
      if(mlMap.getLayer(ROUTE_SELECTED_LAYER_ID))mlMap.setLayoutProperty(ROUTE_SELECTED_LAYER_ID,"visibility",state.mapLayers.route?"visible":"none");
      updateOverlayLabels(); syncSelectedMarker();
    }

    function fitActivities(activities){
      if(!mlMap||!mapReady)return;
      const valid=(activities||[]).map(coordsOf).filter(Boolean);
      if(!valid.length){
        const c=getMetadataCenter(lastMetadata);if(c)mlMap.easeTo({center:[c.lng,c.lat],zoom:Math.max(5,Math.min(14,c.zoom==null?8:c.zoom))});return;
      }
      if(valid.length===1){mlMap.easeTo({center:[valid[0].lng,valid[0].lat],zoom:12});return;}
      const bounds=new maplibregl.LngLatBounds([valid[0].lng,valid[0].lat],[valid[0].lng,valid[0].lat]);
      valid.slice(1).forEach(function(c){bounds.extend([Number(c.lng),Number(c.lat)]);});
      mlMap.fitBounds(bounds,{padding:74,maxZoom:14,duration:350,essential:true});
    }

    function offlineRender(activities){
      lastRenderedActivities=Array.isArray(activities)?activities.slice():[];
      runtime.visibleMapActivities=lastRenderedActivities;
      if(!mlMap||!mapReady)return;
      if(state.selectedActivityId&&!lastRenderedActivities.some(function(a){return a.id===state.selectedActivityId;}))state.selectedActivityId=null;
      if(mapState.selectedActivityId&&!lastRenderedActivities.some(function(a){return a.id===mapState.selectedActivityId;}))mapState.selectedActivityId=null;
      renderMarkers(lastRenderedActivities); updateRoutes(lastRenderedActivities); updateLayerVisibility();
      const locatable=lastRenderedActivities.filter(function(a){return !!coordsOf(a);});
      const empty=document.getElementById("map-empty");if(empty)empty.classList.toggle("show",!locatable.length);
      const subtitle=document.getElementById("map-subtitle");if(subtitle)subtitle.textContent=locatable.length?locatable.length+" local itinerary point"+(locatable.length===1?"":"s")+" · MapLibre + MBTiles":"No matching offline locations";
      syncSelectedMarker();
      if(state.selectedActivityId){const activity=getActivityById(state.selectedActivityId);if(activity)requestAnimationFrame(function(){openActivityPopup(activity);});}
    }

    function offlineZoom(factor){if(!mlMap||!mapReady)return;const target=Math.max(0,Math.min(22,mlMap.getZoom()+Math.log(Number(factor)||1)/Math.log(1.25)));mlMap.zoomTo(target,{duration:180});}
    function offlineCenter(activity,requestedZoom){const c=coordsOf(activity);if(!c||!mlMap||!mapReady){if(activity&&!c)showToast("This activity has no valid map coordinates.");return;}mlMap.easeTo({center:[Number(c.lng),Number(c.lat)],zoom:Math.max(Number(mlMap.getZoom()||0),Number(requestedZoom||12),12),duration:350,essential:true});}
    function offlineReset(){if(!mlMap||!mapReady)return;state.selectedActivityId=null;mapState.selectedActivityId=null;if(activePopup){try{activePopup.remove();}catch(e){}activePopup=null;}fitActivities(allActivities().filter(function(a){return !!coordsOf(a);}));renderMarkers(lastRenderedActivities);showToast("Map reset to its offline overview.");}
    function offlineMapPointFromEvent(event){if(!mlMap)return{x:0,y:0};const rect=mlMap.getCanvas().getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top};}
    function offlineUnprojectCoordinate(x,y){if(!mlMap)return{lat:NaN,lng:NaN};const p=mlMap.unproject([Number(x),Number(y)]);return{lat:Number(p.lat),lng:Number(p.lng)};}

    function initializeMapLibre(){
      if(mapBootPromise)return mapBootPromise;
      mapBootPromise=new Promise(function(resolve,reject){
        (async function(){
          try{
            validateAllCoordinates();
            if(typeof maplibregl==="undefined")throw new Error("MapLibre GL JS failed to load.");
            if(typeof initSqlJs!=="function")throw new Error("SQL.js failed to load.");
            await loadMbtiles();
            installMbtilesProtocol();

            const center=getMetadataCenter(lastMetadata)||{lng:103.8198,lat:1.3521,zoom:8};
            const style=buildStyle();
            mlMap=new maplibregl.Map({container:mapHost(),style:style,center:[center.lng,center.lat],zoom:Math.max(0,Math.min(22,center.zoom==null?8:center.zoom)),attributionControl:false,renderWorldCopies:false,maxPitch:0,maxZoom:22,hash:false});
            if(maplibregl.NavigationControl)mlMap.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");

            mlMap.on("load",function(){
              mapReady=true;
              ensureRouteLayers();
              clearMapStatus();
              offlineRender(lastRenderedActivities);
              fitActivities(lastRenderedActivities);
              requestAnimationFrame(updateOverlayLabels);
              resolve(mlMap);
            });
            mlMap.on("error",function(event){console.error("[Offline Map] MapLibre error:",event&&event.error||event);});
            ["move","zoom","resize","idle"].forEach(function(name){mlMap.on(name,updateOverlayLabels);});
          }catch(error){
            const msg=String(error&&error.message||error||"Unknown error");
            let text="Unable to read offline map file: "+OFFLINE_MAP_URL;
            if(/404|not found|failed to fetch|networkerror/i.test(msg))text="Offline map file not found or blocked: "+OFFLINE_MAP_URL;
            else if(/memory|allocation|out of memory/i.test(msg))text="MBTiles is too large for the browser memory available.";
            else text="Offline MBTiles error: "+msg;
            setMapStatus(text,true);
            console.error("[Offline Map] "+text,error);
            reject(error);
          }
        })();
      });
      return mapBootPromise;
    }

    renderOfflineMap=offlineRender;
    zoomMap=offlineZoom;
    centerMapOnActivity=offlineCenter;
    fitMapToActivities=fitActivities;
    resetMap=offlineReset;
    mapPointFromEvent=offlineMapPointFromEvent;
    unprojectCoordinate=offlineUnprojectCoordinate;

    initializeMapInteractions=function(){
      const host=mapHost();
      if(host&&host.dataset.mapLibreInit!=="1"){host.dataset.mapLibreInit="1";host.classList.add("maplibre-host");}
      initializeMapLibre();
    };

    initializeMapInteractions();
  })();

  initializeApp();

  /* FINAL MAP-ONLY BOOT: preserve all itinerary/map data, but make the map the only primary UI. */
  (function bootFullscreenMap(){
    state.activeView = "map";
    state.overview = false;
    state.selectedDay = "all";
    state.mapDay = "all";
    state.selectedActivityId = null;
    mapState.selectedActivityId = null;
    mapState.fullscreen = true;

    function renderFloatingDayFilter(){
      let host = document.getElementById("full-map-day-filter");
      if(!host){
        host=document.createElement("nav");
        host.id="full-map-day-filter";
        host.className="full-map-day-filter";
        host.setAttribute("aria-label","Map day filter");
        document.body.appendChild(host);
      }
      const current=String(state.mapDay);
      host.innerHTML='<span class="full-map-day-label">TRIP</span>'+
        '<button type="button" class="full-map-day-btn '+(current==="all"?"active":"")+'" data-action="map-select-day" data-day="all" aria-pressed="'+(current==="all")+'">ALL</button>'+
        itinerary.map(function(day){
          const key=String(day.day);
          return '<button type="button" class="full-map-day-btn '+(current===key?"active":"")+'" data-action="map-select-day" data-day="'+day.day+'" aria-pressed="'+(current===key)+'">D'+day.day+'</button>';
        }).join("");
    }

    renderFloatingDayFilter();

    /* Keep the floating selector synchronized when any existing map-day control is used. */
    document.addEventListener("click",function(event){
      const control=event.target.closest && event.target.closest('[data-action="map-select-day"]');
      if(!control)return;
      requestAnimationFrame(function(){
        renderFloatingDayFilter();
        const map = document.getElementById("offline-map");
        if(map) map.dispatchEvent(new Event("fullscreen-map-filter-updated"));
      });
    });

    requestAnimationFrame(function(){
      renderCurrentEnhancedView(true);
      requestAnimationFrame(function(){
        fitMapToActivities(mapFilteredActivities());
      });
    });
  })();


  </script>

<script id="fullscreen-map-ux-script">
(function(){
  "use strict";

  function ensureDayFilterHost(){
    let host=document.getElementById("full-map-day-filter");
    const stage=document.getElementById("map-stage");
    if(!stage) return null;
    if(!host){
      host=document.createElement("nav");
      host.id="full-map-day-filter";
      host.className="full-map-day-filter";
      host.setAttribute("aria-label","Map day filter");
      stage.appendChild(host);
    }else if(host.parentElement!==stage){
      stage.appendChild(host);
    }
    return host;
  }

  function dayFilterMarkup(host){
    const current=String(state.mapDay);
    const collapsed=host && host.classList.contains("collapsed");
    return '<button type="button" class="full-map-day-toggle" data-action="toggle-day-filter" aria-expanded="'+String(!collapsed)+'" aria-controls="full-map-day-body">☰ DAYS</button>'+
      '<div id="full-map-day-body" class="full-map-day-body" role="group" aria-label="Trip days">'+
      '<span class="full-map-day-label">TRIP DAYS</span>'+['all'].concat(itinerary.map(function(d){return String(d.day);})).map(function(key){
        const active=current===key;
        return '<button type="button" class="full-map-day-btn'+(active?' active':'')+'" data-action="map-select-day" data-day="'+(key==='all'?'all':key)+'" aria-pressed="'+String(active)+'">'+(key==='all'?'ALL':'D'+key)+'</button>';
      }).join('')+
      '</div>';
  }

  function renderDayFilter(){
    const host=ensureDayFilterHost();
    if(!host) return null;
    const wasCollapsed=host.classList.contains("collapsed");
    host.innerHTML=dayFilterMarkup(host);
    if(wasCollapsed) host.classList.add("collapsed");

    const toggle=host.querySelector('[data-action="toggle-day-filter"]');
    if(toggle){
      toggle.addEventListener("click",function(event){
        event.preventDefault();
        event.stopPropagation();
        host.classList.toggle("collapsed");
        toggle.setAttribute("aria-expanded",String(!host.classList.contains("collapsed")));
      });
    }
    return host;
  }

  function syncDayFilter(){
    const host=document.getElementById("full-map-day-filter");
    if(!host) return;
    const current=String(state.mapDay);
    host.querySelectorAll(".full-map-day-btn").forEach(function(btn){
      const active=String(btn.getAttribute("data-day"))===current;
      btn.classList.toggle("active",active);
      btn.setAttribute("aria-pressed",String(active));
    });
  }

  function visibleForMap(){
    if(typeof mapFilteredActivities==="function") return mapFilteredActivities();
    return allActivities().filter(function(a){return !!getActivityCoordinates(a);});
  }

  function applyDay(value){
    state.mapDay=value==='all'?'all':Number(value);
    state.selectedDay=state.mapDay;
    state.activeView="map";
    state.overview=false;
    state.selectedActivityId=null;
    state.selectedPlaceId=null;
    mapState.selectedActivityId=null;
    mapState.selectedRoute=null;

    renderDayFilter();
    const list=visibleForMap();
    if(typeof renderMapTopbar==='function') renderMapTopbar("Trip map",state.mapDay==='all'?"All itinerary locations":"Day "+state.mapDay+" locations");
    renderOfflineMap(list);
    syncDayFilter();
    requestAnimationFrame(function(){
      if(typeof fitMapToActivities==='function') fitMapToActivities(list);
    });
  }

  /* Direct listener on the overlay itself. This avoids the map canvas swallowing clicks. */
  function bindDayFilter(){
    const host=ensureDayFilterHost();
    if(!host || host.dataset.bound==="1") return;
    host.dataset.bound="1";
    host.addEventListener("click",function(event){
      const dayButton=event.target.closest('[data-action="map-select-day"]');
      if(dayButton){
        event.preventDefault();
        event.stopPropagation();
        applyDay(dayButton.getAttribute("data-day")||"all");
        return;
      }
    });
  }

  /* Keep the main app in map-only mode while preserving its original data/functions. */
  const originalRender=window.renderCurrentEnhancedView;
  window.renderCurrentEnhancedView=function(autoFit){
    state.activeView="map";
    state.overview=false;
    renderDayFilter();
    bindDayFilter();
    if(typeof window.renderMapMode==='function') window.renderMapMode();
    const list=visibleForMap();
    renderOfflineMap(list);
    if(autoFit) requestAnimationFrame(function(){fitMapToActivities(list);});
    syncDayFilter();
  };

  state.activeView="map";
  state.overview=false;
  state.selectedDay="all";
  state.mapDay="all";
  state.selectedActivityId=null;
  mapState.selectedActivityId=null;
  mapState.fullscreen=true;

  requestAnimationFrame(function(){
    const ws=document.querySelector(".workspace");
    document.documentElement.classList.add("map-focus-mode");
    document.body.classList.add("map-focus-mode");
    if(ws) ws.classList.add("map-focus-mode");

    renderDayFilter();
    bindDayFilter();

    if(typeof initializeMapLibre==='function') initializeMapLibre();
    setTimeout(function(){
      const list=visibleForMap();
      if(typeof renderOfflineMap==='function') renderOfflineMap(list);
      if(typeof fitMapToActivities==='function') fitMapToActivities(list);
      renderDayFilter();
      bindDayFilter();
      syncDayFilter();
    },0);
  });
})();
</script>

<script id="day-location-ux-script">
(function(){
  "use strict";

  function dayExists(day){
    return day === "all" || itinerary.some(function(d){ return Number(d.day) === Number(day); });
  }

  function mapVisibleActivities(){
    var list=allActivities().filter(function(a){ return !!getActivityCoordinates(a); });
    if(state.mapDay !== "all") list=list.filter(function(a){ return Number(a.day)===Number(state.mapDay); });
    var q=normalizeText(state.mapSearchQuery || "");
    if(q){
      list=list.filter(function(a){
        var hay=normalizeText([a.title,a.location,a.city,a.country,a.description,a.shortDescription,a.address,a.notes,a.type,(a.tags||[]).join(" ")].join(" "));
        return hay.indexOf(q)!==-1;
      });
    }
    return list;
  }

  function typeDisplay(activity){
    var raw=String(activity && (activity.category || activity.type) || "Activity").trim().toLowerCase();
    var map={
      food:"Restaurant", restaurant:"Restaurant", attraction:"Attraction", hotel:"Hotel", shopping:"Shopping",
      transport:"Transport", nature:"Nature", cafe:"Cafe", "free time":"Free time"
    };
    if(map[raw]) return map[raw];
    return raw ? raw.charAt(0).toUpperCase()+raw.slice(1) : "Activity";
  }

  function locationAbout(activity){
    return String((activity && (activity.shortDescription || activity.description)) || "").trim();
  }

  function safeText(value, fallback){
    var s=String(value==null?"":value).trim();
    return escapeHtml(s || fallback || "");
  }

  function popupHtmlEnhanced(activity){
    var all=allActivities();
    var idx=all.findIndex(function(a){ return a.id===activity.id; });
    var next=idx>=0 ? all[idx+1] : null;
    var visitDuration=getActivityDuration(activity);
    var time=(activity.start||activity.end) ? ((activity.start||"Time TBD")+""+(activity.end?" – "+activity.end:"")) : "Time TBD";
    var about=locationAbout(activity);
    var coords=getActivityCoordinates(activity);
    var maps=safeMapsUrl(activity.mapsUrl);
    var transport=activity.transport && activity.transport.mode ? activity.transport : null;
    var address=activity.address || activity.city || activity.dayLocation || "Address not specified";
    var nextMove=transport ? (escapeHtml(transport.mode)+(transport.duration!=null ? " · "+escapeHtml(formatMinutes(transport.duration)) : "")+(transport.distance ? " · "+escapeHtml(transport.distance) : "")) : "Not specified";
    var nextStop=next ? locationLabel(next) : "No next stop";

    return '<div class="offline-location-popup" data-location-popup-id="'+escapeHtml(activity.id)+'">'+
      '<div class="olp-kicker">LOCATION · DAY '+escapeHtml(activity.day||"?")+'</div>'+
      '<h3>'+safeText(locationLabel(activity),"Location not specified")+'</h3>'+
      '<div class="olp-sub">'+safeText(activity.title,"Itinerary stop")+'</div>'+
      '<div class="olp-badges"><span class="olp-badge accent">Day '+escapeHtml(activity.day||"?")+'</span><span class="olp-badge">'+escapeHtml(typeDisplay(activity))+'</span></div>'+
      '<div class="olp-grid">'+
        '<div class="olp-item"><small>Address</small><div>📍 '+safeText(address,"Address not specified")+'</div></div>'+
        '<div class="olp-item"><small>Time</small><div>🕐 '+safeText(time,"Time TBD")+'</div></div>'+
        '<div class="olp-item"><small>Duration</small><div>⏱ '+escapeHtml(formatMinutes(visitDuration))+'</div></div>'+
        '<div class="olp-item"><small>Coordinates</small><div>'+(coords ? escapeHtml(coords.lat.toFixed(4)+", "+coords.lng.toFixed(4)) : "Unavailable")+'</div></div>'+
      '</div>'+
      '<div class="olp-about"><small>About</small><p>'+safeText(about,"No description has been added yet.")+'</p></div>'+
      '<div class="olp-next"><b>Next move:</b> '+nextMove+'<br><b>Next stop:</b> '+safeText(nextStop,"No next stop")+'</div>'+
      '<div class="olp-actions">'+
        '<button type="button" data-popup-action="details" data-activity="'+escapeHtml(activity.id)+'">Details</button>'+
        '<button type="button" data-popup-action="focus" data-activity="'+escapeHtml(activity.id)+'">Focus</button>'+
        (maps ? '<a href="'+escapeHtml(maps)+'" target="_blank" rel="noopener noreferrer">Google Maps ↗</a>' : '')+
      '</div>'+
    '</div>';
  }

  function enhancePopupNode(node){
    if(!node || !node.querySelector) return;
    var holder=node.querySelector('.offline-popup');
    if(!holder || holder.querySelector('.offline-location-popup')) return;
    var selectedId=state.selectedActivityId || mapState.selectedActivityId;
    var activity=(selectedId && getActivityById(selectedId)) || null;
    if(!activity){
      var title=(holder.querySelector('strong')||{}).textContent || "";
      activity=allActivities().find(function(a){return locationLabel(a)===title || activityLabel(a)===title;}) || null;
    }
    if(!activity) return;
    holder.outerHTML=popupHtmlEnhanced(activity);
  }

  function bindPopupEnhancer(){
    var stage=document.getElementById("map-stage");
    if(!stage || stage.dataset.locationPopupObserver==="1") return;
    stage.dataset.locationPopupObserver="1";
    var observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        Array.prototype.forEach.call(m.addedNodes||[],function(node){
          if(node.nodeType===1){
            enhancePopupNode(node);
            if(node.querySelectorAll) node.querySelectorAll('.maplibregl-popup-content').forEach(enhancePopupNode);
          }
        });
      });
    });
    observer.observe(stage,{childList:true,subtree:true});

    stage.addEventListener("click",function(event){
      var action=event.target.closest && event.target.closest('[data-popup-action]');
      if(!action) return;
      event.preventDefault();
      event.stopPropagation();
      var id=action.getAttribute("data-activity");
      if(action.getAttribute("data-popup-action")==="details"){
        if(typeof openActivityModalByIdPreserve==="function") openActivityModalByIdPreserve(id);
        return;
      }
      if(action.getAttribute("data-popup-action")==="focus"){
        if(typeof focusPlaceOnMap==="function") focusPlaceOnMap(id);
      }
    });
  }

  function syncDayButtons(){
    var current=String(state.mapDay);
    document.querySelectorAll('.full-map-day-btn[data-day]').forEach(function(btn){
      var active=String(btn.getAttribute('data-day'))===current;
      btn.classList.toggle('active',active);
      btn.setAttribute('aria-pressed',String(active));
    });
    var nav=document.getElementById('day-navigation');
    if(nav){
      nav.querySelectorAll('.day-button[data-action="select-day"]').forEach(function(btn){
        var active=String(btn.getAttribute('data-day'))===current && current!=="all";
        btn.classList.toggle('active',active);
        btn.setAttribute('aria-pressed',String(active));
      });
      var overview=nav.querySelector('.day-button[data-action="overview"]');
      if(overview) overview.classList.toggle('active',state.overview||current==="all");
    }
  }

  function applyMapDayEnhanced(value){
    var normalized=value==="all" ? "all" : Number(value);
    if(normalized!=="all" && (!Number.isFinite(normalized) || !dayExists(normalized))) return;
    var same=String(state.mapDay)===String(normalized) && state.activeView==="map";
    state.mapDay=normalized;
    state.selectedDay=normalized;
    state.activeView="map";
    state.overview=false;
    state.selectedPlaceId=null;
    if(!same){
      state.selectedActivityId=null;
      mapState.selectedActivityId=null;
      mapState.selectedRoute=null;
    }
    var list=mapVisibleActivities();
    runtime.visibleMapActivities=list.slice();
    syncDayButtons();
    if(typeof renderMapTopbar==='function'){
      renderMapTopbar("Trip map",normalized==="all" ? "All itinerary locations" : "Day "+normalized+" locations");
    }
    if(typeof renderOfflineMap==='function') renderOfflineMap(list);
    if(typeof renderDayFilter==='function') renderDayFilter();
    syncDayButtons();
    if(typeof fitMapToActivities==='function' && list.length){
      requestAnimationFrame(function(){ fitMapToActivities(list); });
    }
  }

  function patchSelectMapDay(){
    try{
      selectMapDay=applyMapDayEnhanced;
    }catch(error){
      console.warn("[Day/Location Patch] Could not replace selectMapDay:",error);
    }
  }

  function patchPlaceAndTimelineClicks(){
    document.addEventListener('click',function(event){
      var card=event.target.closest && event.target.closest('[data-activity-card]');
      if(card && !event.target.closest('[data-action]')){
        var id=card.getAttribute('data-activity-card');
        var activity=getActivityById(id);
        if(activity){
          event.preventDefault();
          event.stopImmediatePropagation();
          state.selectedActivityId=id;
          mapState.selectedActivityId=id;
          state.mapDay=Number(activity.day);
          state.selectedDay=Number(activity.day);
          state.activeView='map';
          if(typeof renderOfflineMap==='function') renderOfflineMap(mapVisibleActivities());
          if(typeof centerMapOnActivity==='function') centerMapOnActivity(activity,Math.max((mapState.zoom||1),3));
          syncDayButtons();
        }
      }
    },true);
  }

  function boot(){
    patchSelectMapDay();
    bindPopupEnhancer();
    patchPlaceAndTimelineClicks();
    if(state.mapDay===undefined || state.mapDay===null) state.mapDay=state.selectedDay==="all"?"all":state.selectedDay;
    state.selectedDay=state.mapDay;
    state.activeView="map";
    syncDayButtons();
  }

  if(document.readyState==="loading") document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
</script>
