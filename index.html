<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Offline Travel Itinerary</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #f7f9fc;
      --text: #152033;
      --muted: #64748b;
      --line: #dde5f0;
      --accent: #6057e8;
      --accent-2: #0ea5a8;
      --accent-soft: #eeedff;
      --danger: #c2415d;
      --shadow: 0 16px 42px rgba(25, 42, 70, .10);
      --map-water: #dceefa;
      --map-water-2: #c6e6f8;
      --map-land: #f7f0df;
      --map-land-2: #ecf2dd;
      --map-coast: #a6c8d4;
      --map-road: #d3b582;
      --map-road-secondary: #e3d7bd;
      --map-rail: #b678b3;
      --map-label: #40566a;
      --map-route: #6256e8;
      --focus: 0 0 0 3px rgba(96, 87, 232, .25);
    }
    body.dark {
      --bg: #111827;
      --surface: #182235;
      --surface-2: #202d43;
      --text: #edf4ff;
      --muted: #a6b5ca;
      --line: #34445d;
      --accent: #a9a3ff;
      --accent-2: #52d1ca;
      --accent-soft: #2d2b58;
      --danger: #fb7185;
      --shadow: 0 20px 50px rgba(0, 0, 0, .28);
      --map-water: #132d42;
      --map-water-2: #0d263a;
      --map-land: #2b3d42;
      --map-land-2: #314438;
      --map-coast: #5a8390;
      --map-road: #9b865e;
      --map-road-secondary: #59666b;
      --map-rail: #d08ac9;
      --map-label: #d7e6ef;
      --map-route: #b5b0ff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at 5% 0%, rgba(96,87,232,.12), transparent 31rem), var(--bg);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 320px;
    }
    button, input, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    a { color: var(--accent); }
    .app-shell { max-width: 1600px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 42px) 44px; }
    .trip-header {
      display: flex; gap: 24px; align-items: center; justify-content: space-between;
      padding: clamp(20px, 3vw, 34px); border: 1px solid var(--line); border-radius: 24px;
      background: linear-gradient(120deg, var(--surface), color-mix(in srgb, var(--accent-soft) 54%, var(--surface)));
      box-shadow: var(--shadow);
    }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-weight: 800; letter-spacing: .11em; font-size: .72rem; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.65rem, 3.5vw, 2.7rem); letter-spacing: -.04em; line-height: 1.05; }
    .subtitle { color: var(--muted); margin: 10px 0 0; }
    .header-right { display: flex; gap: 20px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .stats { display: flex; gap: 14px; }
    .stat { min-width: 70px; }
    .stat strong { display: block; font-size: 1.08rem; }
    .stat span { color: var(--muted); font-size: .78rem; }
    .button, .icon-button, .day-button, .filter-clear, .transport-card, .overview-day {
      border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .button:hover, .icon-button:hover, .day-button:hover, .filter-clear:hover, .transport-card:hover, .overview-day:hover {
      transform: translateY(-1px); border-color: var(--accent); box-shadow: 0 8px 18px rgba(40, 50, 90, .11);
    }
    .button { min-height: 42px; padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; font-weight: 700; }
    .button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .button.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .icon-button { width: 42px; height: 42px; display: inline-grid; place-items: center; font-size: 1.05rem; }
    [data-tooltip] { position: relative; }
    [data-tooltip]::after {
      content: attr(data-tooltip); opacity: 0; pointer-events: none; position: absolute; z-index: 50; top: calc(100% + 7px); left: 50%;
      transform: translate(-50%, -3px); width: max-content; max-width: 180px; padding: 5px 8px; border-radius: 7px;
      background: #101827; color: #fff; font-size: .72rem; font-weight: 600; transition: opacity .15s, transform .15s;
    }
    [data-tooltip]:hover::after, [data-tooltip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    .day-strip { display: flex; gap: 10px; overflow-x: auto; padding: 19px 2px 10px; scrollbar-width: thin; }
    .day-button { flex: 0 0 150px; padding: 12px 13px; text-align: left; }
    .day-button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); box-shadow: 0 8px 20px rgba(96,87,232,.14); }
    .day-button small, .day-button span { display: block; }
    .day-button small { color: var(--muted); font-size: .7rem; letter-spacing: .08em; font-weight: 800; }
    .day-button strong { font-size: .9rem; }
    .day-button span { color: var(--muted); font-size: .78rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(360px, .82fr); gap: 20px; align-items: start; }
    .timeline-pane, .map-pane { min-width: 0; }
    .panel { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .filters { padding: 14px; display: grid; grid-template-columns: minmax(160px, 1.8fr) repeat(3, minmax(118px, 1fr)) auto; gap: 10px; margin-bottom: 16px; }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .field input, .field select { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--text); padding: 0 11px; }
    .filter-clear { align-self: end; min-height: 42px; padding: 0 12px; font-weight: 700; color: var(--muted); }
    .content-panel { padding: clamp(16px, 2.2vw, 26px); }
    .section-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin: 0 0 18px; }
    .section-heading h2, .section-heading h3 { margin: 0; letter-spacing: -.025em; }
    .section-heading p { color: var(--muted); margin: 4px 0 0; }
    .results-note { color: var(--muted); font-size: .84rem; white-space: nowrap; }
    .day-group + .day-group { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
    .timeline { position: relative; display: grid; gap: 0; }
    .timeline::before { content: ""; position: absolute; z-index: 0; top: 18px; bottom: 54px; left: 30px; width: 2px; background: linear-gradient(var(--accent), transparent); }
    .activity-wrap { position: relative; padding-left: 70px; }
    .time-pin { position: absolute; z-index: 1; left: 0; top: 18px; width: 61px; text-align: right; color: var(--muted); font-weight: 800; font-size: .76rem; }
    .time-pin::after { content: ""; position: absolute; right: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
    .activity-card { position: relative; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--surface); transition: border-color .16s, transform .16s, box-shadow .16s; }
    .activity-card:hover, .activity-card.active { border-color: var(--accent); transform: translateX(2px); box-shadow: 0 12px 28px rgba(36, 47, 88, .10); }
    .activity-card.active { background: color-mix(in srgb, var(--accent-soft) 48%, var(--surface)); }
    .card-top { display: flex; gap: 13px; align-items: flex-start; }
    .activity-icon { flex: 0 0 39px; height: 39px; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); font-size: 1.18rem; }
    .activity-title { min-width: 0; flex: 1; }
    .activity-title h3 { margin: 0; font-size: 1.02rem; letter-spacing: -.015em; }
    .location { margin: 3px 0 0; color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .pill.type { background: var(--accent-soft); border-color: transparent; color: var(--accent); text-transform: capitalize; }
    .card-actions { display: flex; align-items: center; gap: 7px; }
    .mini-button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 9px; min-height: 32px; padding: 4px 9px; font-size: .77rem; font-weight: 750; }
    .mini-button:hover { border-color: var(--accent); color: var(--accent); }
    .card-image { float: right; margin-left: 13px; width: 92px; height: 72px; padding: 0; border: 0; background: var(--surface-2); border-radius: 11px; overflow: hidden; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-description { color: var(--muted); margin: 12px 0 0; }
    .activity-extra { display: none; margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line); color: var(--muted); }
    .activity-card.expanded .activity-extra { display: block; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 14px; }
    .detail-grid div { overflow-wrap: anywhere; }
    .detail-grid b { color: var(--text); font-size: .78rem; display: block; }
    .note { margin: 9px 0 0; padding: 9px 10px; border-radius: 9px; background: var(--surface-2); font-size: .86rem; overflow-wrap: anywhere; }
    .transport-card { width: 100%; text-align: left; padding: 9px 11px; margin: -2px 0 12px; display: flex; gap: 9px; align-items: center; color: var(--muted); }
    .transport-card strong { color: var(--text); font-size: .82rem; }
    .transport-card span:last-child { margin-left: auto; font-size: .78rem; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; margin: 9px 0 4px 70px; padding: 12px; border-radius: 13px; background: var(--surface-2); }
    .summary span { color: var(--muted); font-size: .72rem; }
    .summary b { display: block; color: var(--text); font-size: .85rem; margin-top: 1px; }
    .empty { padding: 34px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
    .map-pane { position: sticky; top: 16px; }
    .map-panel { overflow: hidden; }
    .map-topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 15px 15px 10px; }
    .map-title { margin: 0; font-size: 1rem; letter-spacing: -.015em; }
    .map-subtitle { color: var(--muted); font-size: .76rem; }
    .map-stage { position: relative; min-height: 480px; border-top: 1px solid var(--line); background: var(--map-water); overflow: hidden; }
    #offline-map { display: block; width: 100%; height: 100%; min-height: 480px; touch-action: none; user-select: none; cursor: grab; }
    #offline-map.dragging { cursor: grabbing; }
    .water-bg { fill: var(--map-water); }
    .water-shape { fill: var(--map-water-2); opacity: .75; }
    .land { fill: var(--map-land); stroke: var(--map-coast); stroke-width: 2; }
    .land.secondary { fill: var(--map-land-2); }
    .road { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .road.primary { stroke: var(--map-road); stroke-width: 5; opacity: .9; }
    .road.secondary { stroke: var(--map-road-secondary); stroke-width: 2.2; opacity: .92; }
    .rail { fill: none; stroke: var(--map-rail); stroke-width: 2.5; stroke-dasharray: 7 5; opacity: .85; pointer-events: none; }
    .city-dot { fill: var(--map-label); }
    .city-label, .road-label, .marker-label, .popup-text, .route-label { fill: var(--map-label); font-family: Inter, Arial, sans-serif; pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
    .city-label { font-size: 18px; font-weight: 800; }
    .road-label { font-size: 11px; font-weight: 700; opacity: .85; }
    .route-line { fill: none; stroke: var(--map-route); stroke-width: 5; stroke-linecap: round; opacity: .9; cursor: pointer; pointer-events: stroke; }
    .route-line.walking { stroke-dasharray: 8 7; }
    .route-line.mrt, .route-line.train { stroke: #e457b8; }
    .route-line.bus { stroke: #f59e0b; }
    .route-line.grab, .route-line.taxi, .route-line.car { stroke: #22a67b; }
    .route-label { font-size: 11px; font-weight: 800; }
    .marker { cursor: pointer; outline: none; }
    .marker-halo { fill: var(--accent); opacity: .18; }
    .marker-core { fill: var(--accent); stroke: white; stroke-width: 3; }
    .marker.selected .marker-core { fill: #f05a7d; stroke-width: 4; }
    .marker-number { fill: white; font-size: 13px; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .marker-label { font-size: 12px; font-weight: 800; }
    .marker-time { font-size: 10px; fill: var(--muted); font-weight: 700; }
    .map-popup-card { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; rx: 12; filter: drop-shadow(0 8px 10px rgba(0,0,0,.17)); }
    .popup-text.title { fill: var(--text); font-size: 14px; font-weight: 800; stroke-width: 3px; }
    .popup-text.sub { fill: var(--muted); font-size: 11px; stroke-width: 3px; }
    .popup-button rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; rx: 7; }
    .popup-button text { fill: var(--accent); font-size: 10px; font-weight: 800; pointer-events: none; }
    .popup-close { cursor: pointer; }
    .popup-close circle { fill: var(--surface-2); stroke: var(--line); }
    .popup-close text { fill: var(--text); text-anchor: middle; dominant-baseline: central; font-size: 13px; font-weight: 900; pointer-events: none; }
    .map-controls { position: absolute; top: 12px; right: 12px; display: grid; gap: 6px; z-index: 4; }
    .map-controls .button { min-height: 34px; padding: 5px 9px; border-radius: 9px; font-size: .76rem; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .map-legend { position: absolute; left: 12px; bottom: 12px; z-index: 3; max-width: 220px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--muted); font-size: .68rem; line-height: 1.75; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 0 3px 0 5px; }
    .legend-line { display: inline-block; width: 16px; height: 0; border-top: 3px solid var(--map-route); margin: 0 3px 3px 5px; }
    .legend-walk { border-top-style: dashed; }
    .legend-mrt { border-top-color: #e457b8; }
    .map-empty { position: absolute; inset: 0; display: none; place-items: center; z-index: 2; pointer-events: none; color: var(--muted); font-weight: 700; text-align: center; padding: 30px; }
    .map-empty.show { display: grid; }
    .overview-hero { padding: clamp(18px, 3vw, 30px); border-radius: 17px; background: linear-gradient(135deg, var(--accent), #2b9aa2); color: white; margin-bottom: 18px; }
    .overview-hero h2 { margin: 0; font-size: clamp(1.3rem, 2vw, 1.8rem); }
    .overview-hero p { margin: 6px 0 0; opacity: .87; }
    .overview-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
    .overview-stats div { padding: 10px; background: rgba(255,255,255,.14); border-radius: 10px; }
    .overview-stats b, .overview-stats span { display: block; }
    .overview-stats span { opacity: .82; font-size: .75rem; }
    .overview-days { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .overview-day { padding: 14px; text-align: left; }
    .overview-day strong, .overview-day span, .overview-day small { display: block; }
    .overview-day span, .overview-day small { color: var(--muted); }
    .overview-day small { font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
    .modal-backdrop, .lightbox { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(9, 15, 28, .68); }
    .modal-backdrop[hidden], .lightbox[hidden] { display: none; }
    .modal { width: min(750px, 100%); max-height: min(800px, 92vh); overflow: auto; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 28px 90px rgba(0,0,0,.4); }
    .modal-header { display: flex; justify-content: space-between; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--surface); }
    .modal-body { padding: 20px; }
    .modal-body h2 { margin: 0; font-size: 1.38rem; letter-spacing: -.025em; }
    .modal-image { width: 100%; max-height: 260px; object-fit: cover; border-radius: 13px; margin-bottom: 16px; background: var(--surface-2); }
    .modal-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .modal-grid > div, .modal-section { padding: 12px; background: var(--surface-2); border-radius: 11px; overflow-wrap: anywhere; }
    .modal-grid small, .modal-section small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: .68rem; font-weight: 800; margin-bottom: 3px; }
    .modal-section { margin-top: 10px; }
    .modal-actions, .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .attachment { display: flex; align-items: center; gap: 7px; flex: 1 1 225px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .attachment strong { display: block; font-size: .8rem; overflow-wrap: anywhere; }
    .attachment small { color: var(--muted); font-size: .7rem; }
    .attachment .attachment-actions { margin-left: auto; display: flex; gap: 5px; }
    .lightbox figure { margin: 0; max-width: min(1050px, 100%); max-height: 92vh; position: relative; }
    .lightbox img { display: block; max-width: 100%; max-height: 88vh; border-radius: 13px; background: var(--surface); }
    .lightbox .icon-button { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.94); color: #142033; }
    #toast { position: fixed; z-index: 120; left: 50%; bottom: 20px; transform: translate(-50%, 18px); opacity: 0; pointer-events: none; max-width: min(500px, calc(100% - 30px)); padding: 10px 14px; border-radius: 11px; background: #101827; color: #fff; box-shadow: 0 12px 28px rgba(0,0,0,.25); transition: opacity .2s, transform .2s; font-weight: 700; font-size: .85rem; text-align: center; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1080px) {
      .workspace { grid-template-columns: minmax(0,1fr); }
      .map-pane { position: relative; top: auto; }
      .map-stage, #offline-map { min-height: 430px; }
    }
    @media (max-width: 760px) {
      .app-shell { padding: 12px 12px 30px; }
      .trip-header { align-items: flex-start; flex-direction: column; gap: 16px; border-radius: 18px; }
      .header-right { width: 100%; justify-content: space-between; gap: 10px; }
      .stats { gap: 10px; }
      .stat { min-width: 62px; }
      .filters { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filters .field:first-child { grid-column: 1 / -1; }
      .filter-clear { grid-column: 1 / -1; }
      .content-panel { padding: 15px; }
      .activity-wrap { padding-left: 54px; }
      .time-pin { width: 46px; font-size: .68rem; }
      .timeline::before { left: 23px; }
      .time-pin::after { right: -5px; }
      .card-image { width: 68px; height: 57px; margin-left: 8px; }
      .summary { margin-left: 54px; grid-template-columns: repeat(2, minmax(0,1fr)); }
      .overview-stats { grid-template-columns: repeat(2, 1fr); }
      .overview-days { grid-template-columns: 1fr; }
      .map-stage, #offline-map { min-height: 380px; }
      .map-legend { max-width: 180px; font-size: .62rem; }
      .modal-grid, .detail-grid { grid-template-columns: 1fr; }
      [data-tooltip]::after { display: none; }
    }
    @media (max-width: 420px) {
      .header-right { align-items: flex-start; flex-direction: column; }
      .stats { width: 100%; justify-content: space-between; }
      .card-actions { gap: 4px; }
      .mini-button { padding: 4px 7px; }
      .map-stage, #offline-map { min-height: 335px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

    /* =========================================================
       PREMIUM TRAVEL OS UPGRADE
       Single-file, offline-safe enhancements layered over the
       existing itinerary / SVG map implementation.
       ========================================================= */
    .trip-header {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      min-height: 245px;
    }
    .trip-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 78% 18%, rgba(96,87,232,.26), transparent 28%),
        radial-gradient(circle at 18% 110%, rgba(14,165,168,.20), transparent 28%),
        linear-gradient(135deg, #0a0c12, #11141d 48%, #090a10);
    }
    .trip-header::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .30;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.72) 0 1px, transparent 1.6px);
      background-size: 14px 14px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 58%, transparent 100%);
      pointer-events: none;

  /* UTILITIES */
  const activityIcons = { food: "🍜", attraction: "✦", shopping: "◈", hotel: "⌂", nature: "◒", transport: "↗", "free time": "☼" };
  function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value).replace(/[&<>"']/g, function(char) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char];
    });
  }
  function safeUrl(value, kind) {
    if (!value || typeof value !== "string") return "";
    try {
      const parsed = new URL(value, window.location.href);
      if (parsed.protocol === "https:" || parsed.protocol === "http:") return parsed.href;
      if (kind === "image" && parsed.protocol === "data:" && /^data:image\/(svg\+xml|png|jpe?g|webp|gif)[;,]/i.test(value)) return value;
      if (kind === "file" && parsed.protocol === "data:" && /^data:text\/plain[;,]/i.test(value)) return value;
    } catch (error) { return ""; }
    return "";
  }
  function safeMapsUrl(value) {
    const url = safeUrl(value, "external");
    return /^https?:\/\//i.test(url) ? url : "";
  }
  function isValidCoordinate(lat, lng) {
    return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
  }
  function getActivityCoordinates(activity) {
    if (!activity || !activity.coordinates) return null;
    const lat = Number(activity.coordinates.lat);
    const lng = Number(activity.coordinates.lng);
    return isValidCoordinate(lat, lng) ? { lat: lat, lng: lng } : null;
  }
  function activityLabel(activity) { return activity && activity.title ? activity.title : "Untitled activity"; }
  function locationLabel(activity) { return activity && activity.location ? activity.location : "Location not specified"; }
  function typeLabel(activity) { return activity && activity.type ? activity.type : "activity"; }
  function formatDate(value, compact) {
    const date = new Date(value + "T12:00:00");
    return new Intl.DateTimeFormat("en-GB", compact ? { day: "2-digit", month: "short" } : { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(date);
  }
  function parseClock(value) {
    if (!/^\d{2}:\d{2}$/.test(value || "")) return null;
    const parts = value.split(":").map(Number);
    return parts[0] * 60 + parts[1];
  }
  function getActivityDuration(activity) {
    if (Number.isFinite(Number(activity && activity.duration)) && Number(activity.duration) >= 0) return Number(activity.duration);
    const start = parseClock(activity && activity.start);
    const end = parseClock(activity && activity.end);
    return start !== null && end !== null && end >= start ? end - start : 0;
  }
  function formatMinutes(minutes) {
    const value = Math.round(Number(minutes) || 0);
    if (value < 60) return value + " min";
    const hours = Math.floor(value / 60);
    const rest = value % 60;
    return hours + "h" + (rest ? " " + rest + "m" : "");
  }
  function formatMoney(value) {

  }
  function renderTimeline(activities, title, subtitle) {
    const safeActivities = Array.isArray(activities) ? activities : [];
    if (!safeActivities.length) {
      return '<div class="section-heading"><div><h2>' + escapeHtml(title || "No matching activities") + '</h2><p>' + escapeHtml(subtitle || "Try broadening the search or clearing a filter.") + '</p></div></div><div class="empty">No activities match the active filters.<br><br><button class="button" type="button" data-action="clear-filters">Clear filters</button></div>';
    }
    return '<div class="section-heading"><div><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(subtitle) + '</p></div><span class="results-note">' + safeActivities.length + " activity" + (safeActivities.length === 1 ? "" : "ies") + '</span></div><div class="timeline">' + safeActivities.map(function(activity) { return renderActivityCard(activity, safeActivities); }).join("") + '</div>' + renderDaySummary(safeActivities);
  }
  function renderCurrentDay() {
    const container = document.getElementById("main-content");
    const activities = visibleActivities();
    if (state.selectedDay === "all") {
      const groups = itinerary.map(function(day) {
        const dayActivities = activities.filter(function(activity) { return activity.day === day.day; });
        if (!dayActivities.length && hasActiveFilters()) return "";
        return '<section class="day-group">' + renderTimeline(dayActivities, "Day " + day.day + " · " + day.title, formatDate(day.date, false) + " · " + day.location) + '</section>';
      }).join("");
      container.innerHTML = groups || renderTimeline([], "No matching activities", "Try broadening the search or clearing a filter.");
      return;
    }
    const day = getDay(state.selectedDay);
    container.innerHTML = renderTimeline(activities, "Day " + day.day + " · " + day.title, formatDate(day.date, false) + " · " + day.location);
  }

  /* OVERVIEW */
  function renderOverview() {
    const container = document.getElementById("main-content");
    const summary = calculateSummary(allActivities());
    const matching = visibleActivities();
    container.innerHTML =
      '<section class="overview-hero"><h2>' + escapeHtml(tripInfo.title) + '</h2><p>A self-contained itinerary with a schematic local map. Routes are direct approximations, not turn-by-turn navigation.</p><div class="overview-stats"><div><b>' + itinerary.length + '</b><span>Days</span></div><div><b>' + summary.places + '</b><span>Places</span></div><div><b>' + summary.activities + '</b><span>Activities</span></div><div><b>' + escapeHtml(formatMoney(summary.cost)) + '</b><span>Planned cost</span></div></div></section>' +
      '<div class="section-heading"><div><h2>Day by day</h2><p>' + matching.length + ' map-visible activity' + (matching.length === 1 ? "" : "ies") + ' under the current filters.</p></div></div><div class="overview-days">' +
      itinerary.map(function(day) {
        const daySummary = calculateSummary(day.activities);

      }).join("") + '</div>';
  }

  /* MAP PROJECTION */
  function projectionInfo() {
    const bounds = offlineMapData.bounds;
    const centerLat = (bounds.minLat + bounds.maxLat) / 2;
    const centerLng = (bounds.minLng + bounds.maxLng) / 2;
    const cosLat = Math.cos(centerLat * Math.PI / 180);
    const longitudeSpan = (bounds.maxLng - bounds.minLng) * cosLat;
    const latitudeSpan = bounds.maxLat - bounds.minLat;
    const availableWidth = MAP_DIMENSIONS.width - MAP_DIMENSIONS.padding * 2;
    const availableHeight = MAP_DIMENSIONS.height - MAP_DIMENSIONS.padding * 2;
    const scale = Math.min(availableWidth / longitudeSpan, availableHeight / latitudeSpan);
    return { centerLat: centerLat, centerLng: centerLng, cosLat: cosLat, scale: scale };
  }
  function projectCoordinate(lat, lng) {
    const info = projectionInfo();
    return {
      x: MAP_DIMENSIONS.width / 2 + (Number(lng) - info.centerLng) * info.cosLat * info.scale,
      y: MAP_DIMENSIONS.height / 2 - (Number(lat) - info.centerLat) * info.scale
    };
  }
  function unprojectCoordinate(x, y) {
    const info = projectionInfo();
    return {
      lat: info.centerLat + (MAP_DIMENSIONS.height / 2 - Number(y)) / info.scale,
      lng: info.centerLng + (Number(x) - MAP_DIMENSIONS.width / 2) / (info.cosLat * info.scale)
    };
  }
  function svgElement(tag, attributes, text) {
    const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attributes || {}).forEach(function(key) {
      if (attributes[key] !== undefined && attributes[key] !== null) element.setAttribute(key, String(attributes[key]));
    });
    if (text !== undefined) element.textContent = text;
    return element;
  }
  function pathFromPoints(points, closed) {
    const safePoints = (points || []).map(function(point) { return projectCoordinate(point[0], point[1]); });
    if (!safePoints.length) return "";
    return safePoints.map(function(point, index) { return (index ? "L" : "M") + point.x.toFixed(2) + " " + point.y.toFixed(2); }).join(" ") + (closed ? " Z" : "");
  }
  function appendMapText(parent, x, y, text, className, extra) {
    const attrs = Object.assign({ x: x, y: y, class: className }, extra || {});
    parent.appendChild(svgElement("text", attrs, text));
  }
  function drawBaseMap(root) {
    root.appendChild(svgElement("rect", { x: 0, y: 0, width: MAP_DIMENSIONS.width, height: MAP_DIMENSIONS.height, class: "water-bg" }));
    offlineMapData.water.forEach(function(shape) {
      root.appendChild(svgElement("path", { d: pathFromPoints(shape, true), class: "water-shape" }));
    });
    offlineMapData.land.forEach(function(shape, index) {
      root.appendChild(svgElement("path", { d: pathFromPoints(shape, true), class: "land" + (index ? " secondary" : "") }));
    });
    offlineMapData.roads.forEach(function(road) {
      root.appendChild(svgElement("path", { d: pathFromPoints(road.points, false), class: "road " + (road.type || "secondary") }));
      const midpoint = road.points[Math.floor(road.points.length / 2)];
      if (midpoint && (mapState.zoom >= 1.7 || road.type === "primary")) {
        const p = projectCoordinate(midpoint[0], midpoint[1]);
        appendMapText(root, p.x + 6, p.y - 5, road.name, "road-label");
      }
    });
    offlineMapData.railways.forEach(function(rail) {
      root.appendChild(svgElement("path", { d: pathFromPoints(rail.points, false), class: "rail" }));
    });
    offlineMapData.places.forEach(function(place) {
      if (!place.important && mapState.zoom < 1.65) return;
      const p = projectCoordinate(place.lat, place.lng);
      root.appendChild(svgElement("circle", { cx: p.x, cy: p.y, r: place.important ? 4 : 3, class: "city-dot" }));
      appendMapText(root, p.x + 8, p.y - 8, place.name, "city-label");
    });
  }
  function modeClass(mode) {
    return String(mode || "").toLocaleLowerCase().replace(/\s+/g, "-") || "direct";
  }
  function drawRoutes(root, activities) {
    const byDay = new Map();
    activities.forEach(function(activity) {
      if (!byDay.has(activity.day)) byDay.set(activity.day, []);
      byDay.get(activity.day).push(activity);
    });
    byDay.forEach(function(dayActivities) {
      for (let index = 0; index < dayActivities.length - 1; index += 1) {
        const from = dayActivities[index];
        const to = dayActivities[index + 1];
        const aCoords = getActivityCoordinates(from);
        const bCoords = getActivityCoordinates(to);
        if (!aCoords || !bCoords) continue;
        const aPoint = projectCoordinate(aCoords.lat, aCoords.lng);
        const bPoint = projectCoordinate(bCoords.lat, bCoords.lng);
        const transport = from.transport || {};
        const route = svgElement("path", {
          d: "M" + aPoint.x.toFixed(2) + " " + aPoint.y.toFixed(2) + " L" + bPoint.x.toFixed(2) + " " + bPoint.y.toFixed(2),
          class: "route-line " + modeClass(transport.mode),
          "data-action": "map-route",
          "data-next": to.id,
          tabindex: 0,
          role: "button",
          "aria-label": "View direct " + (transport.mode || "route") + " route to " + activityLabel(to)
        });
        root.appendChild(route);
        if (mapState.zoom >= 1.45 && transport.mode) {
          appendMapText(root, (aPoint.x + bPoint.x) / 2 + 7, (aPoint.y + bPoint.y) / 2 - 7, transport.mode + " · " + (transport.distance || "direct"), "route-label");
        }
      }
    });
  }
  function drawPopup(root, activity) {
    const coords = getActivityCoordinates(activity);
    if (!coords) return;
    const point = projectCoordinate(coords.lat, coords.lng);
    const width = 235;
    const height = safeMapsUrl(activity.mapsUrl) ? 116 : 91;
    const x = Math.max(8, Math.min(MAP_DIMENSIONS.width - width - 8, point.x + 22));
    const y = Math.max(8, point.y - height - 14);
    const group = svgElement("g", { class: "map-popup" });
    group.appendChild(svgElement("rect", { x: x, y: y, width: width, height: height, class: "map-popup-card" }));
    appendMapText(group, x + 12, y + 21, (activity.start || "Time TBD") + " · " + activityLabel(activity), "popup-text title");
    appendMapText(group, x + 12, y + 40, "⌖ " + locationLabel(activity), "popup-text sub");
    appendMapText(group, x + 12, y + 57, typeLabel(activity) + " · direct itinerary point", "popup-text sub");
    const close = svgElement("g", { class: "popup-close", "data-action": "map-popup-close", role: "button", tabindex: 0, "aria-label": "Close map popup" });
    close.appendChild(svgElement("circle", { cx: x + width - 16, cy: y + 16, r: 10 }));
    close.appendChild(svgElement("text", { x: x + width - 16, y: y + 16 }, "×"));
    group.appendChild(close);
    const details = svgElement("g", { class: "popup-button", "data-action": "map-details", "data-activity": activity.id, role: "button", tabindex: 0, "aria-label": "View details for " + activityLabel(activity) });
    details.appendChild(svgElement("rect", { x: x + 11, y: y + 68, width: 86, height: 25 }));
    details.appendChild(svgElement("text", { x: x + 22, y: y + 85 }, "View details"));
    group.appendChild(details);
    if (safeMapsUrl(activity.mapsUrl)) {
      const maps = svgElement("g", { class: "popup-button", "data-action": "map-open-external", "data-activity": activity.id, role: "button", tabindex: 0, "aria-label": "Open " + activityLabel(activity) + " in Google Maps" });
      maps.appendChild(svgElement("rect", { x: x + 105, y: y + 68, width: 110, height: 25 }));
      maps.appendChild(svgElement("text", { x: x + 116, y: y + 85 }, "Google Maps ↗"));
      group.appendChild(maps);
    }
    root.appendChild(group);
  }
  function renderActivityMarkers(root, activities) {
    const counts = new Map();
    activities.forEach(function(activity) {
      counts.set(activity.day, (counts.get(activity.day) || 0) + 1);
      const coords = getActivityCoordinates(activity);
      if (!coords) return;
      const point = projectCoordinate(coords.lat, coords.lng);
      const selected = mapState.selectedActivityId === activity.id;
      const group = svgElement("g", {
        class: "marker" + (selected ? " selected" : ""),
        transform: "translate(" + point.x.toFixed(2) + " " + point.y.toFixed(2) + ")",
        "data-action": "map-marker",
        "data-activity": activity.id,
        role: "button",
        tabindex: 0,
        "aria-label": (activity.start || "Time TBD") + ", " + activityLabel(activity) + ", " + locationLabel(activity)
      });
      group.appendChild(svgElement("title", {}, (activity.start || "Time TBD") + " · " + activityLabel(activity) + " · " + locationLabel(activity)));
      if (selected) group.appendChild(svgElement("circle", { cx: 0, cy: 0, r: 22, class: "marker-halo" }));
      group.appendChild(svgElement("circle", { cx: 0, cy: 0, r: selected ? 15 : 13, class: "marker-core" }));
      group.appendChild(svgElement("text", { x: 0, y: 1, class: "marker-number" }, String(counts.get(activity.day))));
      if (selected || mapState.zoom >= 1.7) {
        appendMapText(group, 18, -8, activityLabel(activity), "marker-label");
        appendMapText(group, 18, 8, (activity.start || "") + " · " + locationLabel(activity), "marker-label marker-time");
      }
      root.appendChild(group);
    });
    const selected = activities.find(function(activity) { return activity.id === mapState.selectedActivityId; });
    if (selected) drawPopup(root, selected);
  }
  function updateMapTransform() {
    const root = document.getElementById("map-root");
    if (root) root.setAttribute("transform", "translate(" + mapState.offsetX.toFixed(2) + " " + mapState.offsetY.toFixed(2) + ") scale(" + mapState.zoom.toFixed(3) + ")");
  }
  function scheduleMapTransform() {
    if (runtime.raf) return;
    runtime.raf = requestAnimationFrame(function() {
      runtime.raf = null;
      updateMapTransform();
    });
  }
  function renderOfflineMap(activities) {
    const safeActivities = Array.isArray(activities) ? activities : [];
    runtime.visibleMapActivities = safeActivities;
    const svg = document.getElementById("offline-map");
    svg.replaceChildren();
    const root = svgElement("g", { id: "map-root" });
    svg.appendChild(root);
    drawBaseMap(root);
    drawRoutes(root, safeActivities);
    renderActivityMarkers(root, safeActivities);
    updateMapTransform();
    const locatable = safeActivities.filter(function(activity) { return Boolean(getActivityCoordinates(activity)); });
    document.getElementById("map-empty").classList.toggle("show", !locatable.length);
    document.getElementById("map-subtitle").textContent = locatable.length ? locatable.length + " local itinerary point" + (locatable.length === 1 ? "" : "s") + " · direct route approximation" : "Locally drawn base map · no matching locations";
  }
  function clampZoom(value) { return Math.max(MAP_DIMENSIONS.minZoom, Math.min(MAP_DIMENSIONS.maxZoom, value)); }
  function zoomMap(factor, origin) {
    const oldZoom = mapState.zoom;
    const newZoom = clampZoom(oldZoom * factor);
    if (newZoom === oldZoom) return;
    const point = origin || { x: MAP_DIMENSIONS.width / 2, y: MAP_DIMENSIONS.height / 2 };
    const actualFactor = newZoom / oldZoom;
    mapState.offsetX = point.x - (point.x - mapState.offsetX) * actualFactor;
    mapState.offsetY = point.y - (point.y - mapState.offsetY) * actualFactor;
    mapState.zoom = newZoom;
    scheduleMapTransform();
  }
  function centerMapOnActivity(activity, requestedZoom) {
    const coords = getActivityCoordinates(activity);
    if (!coords) {
      showToast("This activity has no valid map coordinates.");
      return;
    }
    const point = projectCoordinate(coords.lat, coords.lng);
    mapState.zoom = clampZoom(requestedZoom || Math.max(mapState.zoom, 3));
    mapState.offsetX = MAP_DIMENSIONS.width / 2 - point.x * mapState.zoom;
    mapState.offsetY = MAP_DIMENSIONS.height / 2 - point.y * mapState.zoom;
    updateMapTransform();
  }
  function fitMapToActivities(activities) {
    const points = (activities || []).map(getActivityCoordinates).filter(Boolean).map(function(coords) { return projectCoordinate(coords.lat, coords.lng); });
    if (!points.length) {
      showToast("No valid coordinates are available for this view.");
      return;
    }
    if (points.length === 1) {
      const point = points[0];
      mapState.zoom = 3.4;
      mapState.offsetX = MAP_DIMENSIONS.width / 2 - point.x * mapState.zoom;
      mapState.offsetY = MAP_DIMENSIONS.height / 2 - point.y * mapState.zoom;
      updateMapTransform();
      return;
    }
    const xs = points.map(function(point) { return point.x; });
    const ys = points.map(function(point) { return point.y; });
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    const spanX = Math.max(90, maxX - minX);
    const spanY = Math.max(90, maxY - minY);
    const padding = 125;
    mapState.zoom = clampZoom(Math.min((MAP_DIMENSIONS.width - padding * 2) / spanX, (MAP_DIMENSIONS.height - padding * 2) / spanY));
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    mapState.offsetX = MAP_DIMENSIONS.width / 2 - centerX * mapState.zoom;
    mapState.offsetY = MAP_DIMENSIONS.height / 2 - centerY * mapState.zoom;
    updateMapTransform();
  }
  function resetMap() {
    mapState.zoom = 1;
    mapState.offsetX = 0;
    mapState.offsetY = 0;
    updateMapTransform();
    showToast("Map reset to its offline overview.");
  }

  /* MODAL AND LIGHTBOX */
  function openActivityModal(id) {
    const activity = getActivityById(id);
    if (!activity) return;
    selectActivity(id, false);
    const duration = getActivityDuration(activity);
    const transport = activity.transport;
    const modal = document.getElementById("activity-modal");
    const image = imageMarkup(activity, false);
    const grid = [
      ["Time", (activity.start || "Time TBD") + (activity.end ? " – " + activity.end : "")],
      ["Type", typeLabel(activity)],
      ["Location", locationLabel(activity)],
      ["Address", activity.address || "Address not specified"],
      ["Duration", duration ? formatMinutes(duration) : "Not specified"],
      ["Cost", Number.isFinite(Number(activity.cost)) ? formatMoney(activity.cost) : "Not specified"]
    ];
    modal.innerHTML = '<header class="modal-header"><div><p class="eyebrow">Day ' + activity.day + " · " + escapeHtml(formatDate(activity.date, true)) + '</p><h2 id="modal-title">' + escapeHtml(activityLabel(activity)) + '</h2></div><button class="icon-button" type="button" data-action="modal-close" aria-label="Close details">×</button></header><div class="modal-body">' +
      image + '<div class="modal-grid">' + grid.map(function(row) { return '<div><small>' + escapeHtml(row[0]) + '</small>' + escapeHtml(row[1]) + '</div>'; }).join("") + '</div>' +
      (activity.description ? '<section class="modal-section"><small>Description</small>' + escapeHtml(activity.description) + '</section>' : "") +
      (activity.notes ? '<section class="modal-section"><small>Notes</small>' + escapeHtml(activity.notes) + '</section>' : "") +
      (transport ? '<section class="modal-section"><small>Next transport</small>' + transportIcon(transport.mode) + " " + escapeHtml(transport.mode) + " · " + escapeHtml(formatMinutes(transport.duration)) + " · " + escapeHtml(transport.distance || "Distance unavailable") + '<br>' + escapeHtml(transport.note || "Direct itinerary route") + '</section>' : "") +
      attachmentMarkup(activity) + '<div class="modal-actions">' + mapsButtonMarkup(activity, "button primary") + '<button class="button soft" type="button" data-action="focus-on-map" data-activity="' + escapeHtml(activity.id) + '">⌖ Focus on map</button></div></div>';
    runtime.lastFocused = document.activeElement;
    document.getElementById("modal-backdrop").hidden = false;
    document.body.style.overflow = "hidden";
    const close = modal.querySelector('[data-action="modal-close"]');
    if (close) close.focus();
  }
  function closeActivityModal() {
    const backdrop = document.getElementById("modal-backdrop");
    if (backdrop.hidden) return;
    backdrop.hidden = true;
    document.body.style.overflow = "";
    if (runtime.lastFocused && typeof runtime.lastFocused.focus === "function") runtime.lastFocused.focus();
  }
  function openLightbox(id) {
    const activity = getActivityById(id);
    const url = safeUrl(activity && activity.imageUrl, "image");
    if (!url) {
      showToast("No image is available for this activity.");
      return;
    }
    const image = document.getElementById("lightbox-image");
    image.src = url;
    image.alt = activityLabel(activity);
    document.getElementById("lightbox").hidden = false;
  }
  function closeLightbox() {
    const lightbox = document.getElementById("lightbox");
    lightbox.hidden = true;
    document.getElementById("lightbox-image").removeAttribute("src");
  }

  /* SELECTION AND RENDERING */
  function selectActivity(id, scrollTimeline) {
    const activity = getActivityById(id);
    if (!activity) return;
    state.selectedActivityId = id;
    mapState.selectedActivityId = id;
    renderMain(false);
    centerMapOnActivity(activity, Math.max(mapState.zoom, 3));
    if (scrollTimeline) {
      const card = document.querySelector('[data-activity-card="' + CSS.escape(id) + '"]');
      if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  function renderMain(autoFit) {
    if (state.overview) renderOverview();
    else renderCurrentDay();
    const activities = visibleActivities();
    renderOfflineMap(activities);
    if (autoFit) {
      requestAnimationFrame(function() { fitMapToActivities(activities); });
    }
  }

  /* THEME */
  function loadTheme() {
    let saved = null;
    try { saved = localStorage.getItem("travel-theme"); } catch (error) { saved = null; }
    const dark = saved ? saved === "dark" : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.body.classList.toggle("dark", dark);
  }
  function saveTheme() {
    try { localStorage.setItem("travel-theme", document.body.classList.contains("dark") ? "dark" : "light"); } catch (error) { /* storage may be unavailable for file URLs */ }
  }
  function toggleTheme() {
    document.body.classList.toggle("dark");
    saveTheme();
    renderHeader();
    showToast(document.body.classList.contains("dark") ? "Dark theme enabled." : "Light theme enabled.");
  }

  /* EVENTS */
  function eventActivityId(target) {
    return target && target.getAttribute ? target.getAttribute("data-activity") : null;
  }
  document.addEventListener("click", function(event) {
    const control = event.target.closest("[data-action]");
    if (control) {
      const action = control.getAttribute("data-action");
      const id = eventActivityId(control);
      if (action === "overview") {
        state.overview = true; state.selectedDay = "all"; state.selectedActivityId = null; mapState.selectedActivityId = null; applyFilters();
      } else if (action === "select-day" || action === "overview-day") {
        state.selectedDay = Number(control.getAttribute("data-day")); state.overview = false; state.selectedActivityId = null; mapState.selectedActivityId = null; applyFilters();
      } else if (action === "theme") {
        toggleTheme();
      } else if (action === "clear-filters") {
        state.searchQuery = ""; state.activityType = "all"; state.transportType = "all"; state.selectedDay = "all"; state.overview = false; state.selectedActivityId = null; mapState.selectedActivityId = null; renderFilters(); applyFilters(); showToast("Filters cleared.");
      } else if (action === "toggle-card") {
        if (state.expandedActivities.has(id)) state.expandedActivities.delete(id); else state.expandedActivities.add(id);
        renderMain(false);
      } else if (action === "details" || action === "map-details") {
        openActivityModal(id);
      } else if (action === "lightbox-open") {
        openLightbox(id);
      } else if (action === "modal-close") {
        closeActivityModal();
      } else if (action === "lightbox-close") {
        closeLightbox();
      } else if (action === "focus-on-map") {
        closeActivityModal(); selectActivity(id, true);
      } else if (action === "focus-next" || action === "map-route") {
        const next = control.getAttribute("data-next");
        if (next) selectActivity(next, true); else showToast("This is the last stop of the visible route.");
      } else if (action === "map-marker") {
        selectActivity(id, true);
      } else if (action === "map-popup-close") {
        state.selectedActivityId = null; mapState.selectedActivityId = null; renderMain(false);
      } else if (action === "map-open-external") {
        const activity = getActivityById(id);
        const url = safeMapsUrl(activity && activity.mapsUrl);
        if (url) window.open(url, "_blank", "noopener,noreferrer"); else showToast("No safe Google Maps link is available.");
      } else if (action === "map-zoom-in") {
        zoomMap(1.25);
      } else if (action === "map-zoom-out") {
        zoomMap(0.8);
      } else if (action === "map-fit") {
        fitMapToActivities(runtime.visibleMapActivities);
      } else if (action === "map-reset") {
        resetMap();
      }

  /* MAP INTERACTIONS: wheel zoom, pointer pan, and two-finger pinch. */
  function mapPointFromEvent(event) {
    const svg = document.getElementById("offline-map");
    const rect = svg.getBoundingClientRect();
    return { x: (event.clientX - rect.left) * MAP_DIMENSIONS.width / rect.width, y: (event.clientY - rect.top) * MAP_DIMENSIONS.height / rect.height };
  }
  function pointerDistance() {
    const points = Array.from(runtime.mapPointers.values());
    return Math.hypot(points[0].clientX - points[1].clientX, points[0].clientY - points[1].clientY);
  }
  function pointerMidpoint() {
    const points = Array.from(runtime.mapPointers.values());
    return { clientX: (points[0].clientX + points[1].clientX) / 2, clientY: (points[0].clientY + points[1].clientY) / 2 };
  }
  function initializeMapInteractions() {
    const svg = document.getElementById("offline-map");
    svg.addEventListener("wheel", function(event) {
      event.preventDefault();
      zoomMap(event.deltaY < 0 ? 1.16 : 0.86, mapPointFromEvent(event));
    }, { passive: false });
    svg.addEventListener("pointerdown", function(event) {
      if (event.target.closest && event.target.closest("[data-action]")) return;
      svg.setPointerCapture(event.pointerId);
      runtime.mapPointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
      runtime.panMoved = false;
      if (runtime.mapPointers.size === 1) runtime.mapGesture = { last: mapPointFromEvent(event) };
      if (runtime.mapPointers.size === 2) runtime.mapGesture = { distance: pointerDistance(), midpoint: pointerMidpoint() };
      svg.classList.add("dragging");
    });
    svg.addEventListener("pointermove", function(event) {
      if (!runtime.mapPointers.has(event.pointerId)) return;
      runtime.mapPointers.set(event.pointerId, { clientX: event.clientX, clientY: event.clientY });
      if (runtime.mapPointers.size === 1 && runtime.mapGesture && runtime.mapGesture.last) {
        const current = mapPointFromEvent(event);
        const last = runtime.mapGesture.last;
        if (Math.abs(current.x - last.x) > 1 || Math.abs(current.y - last.y) > 1) runtime.panMoved = true;
        mapState.offsetX += current.x - last.x;
        mapState.offsetY += current.y - last.y;
        runtime.mapGesture.last = current;
        scheduleMapTransform();
      } else if (runtime.mapPointers.size === 2 && runtime.mapGesture && runtime.mapGesture.distance) {
        const distance = pointerDistance();
        const midpoint = pointerMidpoint();
        if (distance > 0) zoomMap(distance / runtime.mapGesture.distance, mapPointFromEvent(midpoint));
        runtime.mapGesture = { distance: distance, midpoint: midpoint };
        runtime.panMoved = true;
      }
    });
    function endPointer(event) {
      runtime.mapPointers.delete(event.pointerId);
      if (runtime.mapPointers.size === 1) {
        const only = Array.from(runtime.mapPointers.values())[0];
        runtime.mapGesture = { last: mapPointFromEvent(only) };
      } else if (!runtime.mapPointers.size) {
        runtime.mapGesture = null;
        svg.classList.remove("dragging");
      }
    }
    svg.addEventListener("pointerup", endPointer);
    svg.addEventListener("pointercancel", endPointer);
    window.addEventListener("resize", function() { scheduleMapTransform(); });
  }

  function parseDistanceKm(value) {
    if (typeof value !== "string") return null;
    const text = normalizeText(value).replace(",", ".");
    const match = text.match(/(-?\d+(?:\.\d+)?)\s*(km|m)\b/);
    if (!match) return null;
    const number = Number(match[1]);
    return Number.isFinite(number) ? (match[2] === "m" ? number / 1000 : number) : null;
  }

  function calculateEnhancedSummary(activities) {
    const base = calculateSummary(activities);
    const list = Array.isArray(activities) ? activities : [];
    const distanceValues = list.map(function(a) { return parseDistanceKm(a.transport && a.transport.distance); }).filter(function(v) { return v !== null; });
    const walking = list.filter(function(a) { return a.transport && normalizeText(a.transport.mode) === "walking"; });
    const rail = list.filter(function(a) {

    const attractions = list.filter(function(a) { return ["attraction","nature"].includes(typeLabel(a)); });
    return Object.assign({}, base, {
      distanceKm: distanceValues.length ? distanceValues.reduce(function(s, v) { return s + v; }, 0) : null,
      walkingMinutes: walking.reduce(function(s, a) { return s + Number(a.transport && a.transport.duration || 0); }, 0),
      railMinutes: rail.reduce(function(s, a) { return s + Number(a.transport && a.transport.duration || 0); }, 0),
      foodStops: food.length,
      attractions: attractions.length,
      averageActivitiesPerDay: itinerary.length ? list.length / itinerary.length : 0
    });

    const type = document.getElementById("type-filter");
    const transport = document.getElementById("transport-filter");
    const day = document.getElementById("day-filter");
    if (input) input.addEventListener("input", function(event) {
      state.searchQuery = event.target.value; state.activeView = "itinerary"; state.overview = false; renderCurrentEnhancedView(true);
    });
    if (type) type.addEventListener("change", function(event) {
      state.activityType = event.target.value; state.activeView = "itinerary"; state.overview = false; renderCurrentEnhancedView(true);
    });
    if (transport) transport.addEventListener("change", function(event) {
      state.transportType = event.target.value; state.activeView = "itinerary"; state.overview = false; renderCurrentEnhancedView(true);
    });
    if (day) day.addEventListener("change", function(event) {
      state.selectedDay = event.target.value === "all" ? "all" : Number(event.target.value);
      state.mapDay = state.selectedDay;
      state.activeView = "itinerary"; state.overview = false; renderCurrentEnhancedView(true);
    });
  }

  function renderTripView(autoFit) {
    const ws = document.querySelector(".workspace");
    ws.classList.remove("map-mode","places-mode","map-focus-mode");
    const timelinePane = ws.querySelector(".timeline-pane");
    timelinePane.innerHTML = '<div id="filters" class="filters panel"></div><div id="main-content" class="content-panel panel"></div>';
    renderFilters();
    renderCurrentDay();
    state.overview = false;
    document.body.classList.remove("map-focus-mode");
    const inspector = document.getElementById("place-inspector-pane");
    if (inspector) inspector.remove();
    document.querySelector(".map-title").textContent = "Offline travel map";
    document.getElementById("map-subtitle").textContent = "Locally drawn from itinerary data";
    renderOfflineMap(visibleActivities());
    if (autoFit) requestAnimationFrame(function(){ fitMapToActivities(visibleActivities()); });
  }

  function ensureInspectorPane() {
    const ws = document.querySelector(".workspace");
    let pane = document.getElementById("place-inspector-pane");
    if (!pane) {
      pane = document.createElement("aside");
      pane.id = "place-inspector-pane";
      pane.className = "inspector-pane panel";
      pane.setAttribute("aria-label","Place Inspector");
      ws.appendChild(pane);
    }
    return pane;
  }

  function renderMapTopbar(title, subtitle) {
    const top = document.querySelector(".map-topbar");
    const day = state.mapDay === "all" ? "ALL TRIP" : "DAY " + state.mapDay;
    top.innerHTML = '<div><h2 class="map-title">' + escapeHtml(title) + '</h2><span id="map-subtitle" class="map-subtitle">' + escapeHtml(subtitle) + '</span><span class="map-status-badge">' + escapeHtml(day) + ' · Offline map</span></div>' +
      '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">' +
      '<button class="button" type="button" data-action="map-layers" aria-expanded="false">☷ Layers</button>' +
      '<button class="button" type="button" data-action="map-fit">◎ Fit</button>' +
      '<button class="button" type="button" data-action="map-fullscreen">' + (mapState.fullscreen ? "× Close" : "⛶ Expand") + '</button>' +
      '</div>';
    ensureLayerPopover();
  }

  function ensureLayerPopover() {
    const stage = document.getElementById("map-stage");
    let pop = document.getElementById("layer-popover");
    if (!pop) { pop = document.createElement("div"); pop.id="layer-popover"; pop.className="layer-popover"; pop.hidden=true; stage.appendChild(pop); }
    pop.innerHTML = '<h4>Map layers</h4>' +
      ["places","route","roads","rail","cities","labels"].map(function(layer){
        const label = layer.charAt(0).toUpperCase()+layer.slice(1);
        return '<label class="layer-row"><span>' + label + '</span><input type="checkbox" data-action="toggle-layer" data-layer="' + layer + '" ' + (state.mapLayers[layer] ? "checked" : "") + ' aria-label="Toggle ' + label + '"></label>';
      }).join("");
  }

  function mapFilteredActivities() {
    let list = allActivities().filter(function(a){ return getActivityCoordinates(a); });
    if (state.mapDay !== "all") list = list.filter(function(a){ return a.day === Number(state.mapDay); });
    const query = normalizeText(state.mapSearchQuery);
    if (query) {
      list = list.filter(function(a){
        const hay = normalizeText([a.title,a.location,a.city,a.country,a.description,a.notes,(a.tags||[]).join(" ")].join(" "));
        return hay.includes(query);
      });
    }
    return list;
  }

  function selectMapDay(value) {
    state.mapDay = value === "all" ? "all" : Number(value);
    state.selectedDay = state.mapDay;
    state.activeView = "map";
    state.overview = false;
    state.selectedActivityId = null;
    state.selectedPlaceId = null;
    mapState.selectedActivityId = null;
    const list = mapFilteredActivities();
    renderMapMode();
    renderOfflineMap(list);
    requestAnimationFrame(function(){ fitMapToActivities(list); });
  }

  function renderMapMode() {
    const ws = document.querySelector(".workspace");
    /* Map mode defaults to the complete trip; the floating day selector can switch to one day. */
    if (state.mapDay === undefined || state.mapDay === null) state.mapDay = "all";
    state.selectedDay = state.mapDay;
    ws.classList.remove("places-mode");
    ws.classList.add("map-mode","map-focus-mode");
    mapState.fullscreen=true;
    document.body.classList.add("map-focus-mode");
    document.documentElement.classList.add("map-focus-mode");
    const timelinePane = ws.querySelector(".timeline-pane");
    timelinePane.innerHTML = '<div class="mode-panel pane-scroll">' +
      '<div class="section-heading"><div><div class="mode-eyebrow">Independent map</div><h2>Trip map</h2><p>Browse places independently from the timeline.</p></div><span class="directory-stats">' + mapFilteredActivities().length + ' points</span></div>' +
      '<div class="map-mode-toolbar">' +
        '<div class="map-day-strip" role="group" aria-label="Map day selector">' +
          itinerary.map(function(d){return '<button class="map-day-chip '+(String(state.mapDay)===String(d.day)?"active":"")+'" type="button" data-action="map-select-day" data-day="'+d.day+'" aria-pressed="'+String(String(state.mapDay)===String(d.day))+'">Day '+d.day+'</button>';}).join("") +
          '<button class="map-day-chip '+(String(state.mapDay)==="all"?"active":"")+'" type="button" data-action="map-select-day" data-day="all" aria-pressed="'+String(String(state.mapDay)==="all")+'">All</button>' +
        '</div>' +
        '<select id="map-day-select" aria-label="Map day" class="sr-only"><option value="all">All trip</option>' + itinerary.map(function(d){return '<option value="'+d.day+'" '+(String(state.mapDay)===String(d.day)?"selected":"")+'>Day '+d.day+' · '+escapeHtml(d.title)+'</option>';}).join("") + '</select>' +
        '<input id="map-search" type="search" placeholder="Search places…" value="' + escapeHtml(state.mapSearchQuery) + '" autocomplete="off">' +
        '<button class="button soft" type="button" data-action="map-fit">Fit</button>' +
      '</div>' +
      '<div class="place-list">' + mapFilteredActivities().map(renderPlaceListItem).join("") + '</div></div>';
    const select = document.getElementById("map-day-select");
    const search = document.getElementById("map-search");
    if (select) select.addEventListener("change", function(e){
      selectMapDay(e.target.value);
    });
    if (search) search.addEventListener("input", function(e){
      state.mapSearchQuery = e.target.value;
      const list = mapFilteredActivities();
      const box = timelinePane.querySelector(".place-list");
      if (box) box.innerHTML = list.map(renderPlaceListItem).join("") || '<div class="empty">No places match this map search.</div>';
      renderOfflineMap(list);
    });
    renderMapTopbar("Independent map", "All trip layers are local SVG data.");
    renderOfflineMap(mapFilteredActivities());
    ensureInspectorPane();
    renderPlaceInspector(state.selectedActivityId);
    requestAnimationFrame(function(){ fitMapToActivities(mapFilteredActivities()); });
  }

  function renderPlacesView() {
    const ws = document.querySelector(".workspace");
    ws.classList.remove("map-mode","map-focus-mode");
    ws.classList.add("places-mode");
    const timelinePane = ws.querySelector(".timeline-pane");
    const places = placeActivities().slice().sort(function(a,b){ return (a.day-b.day) || a.title.localeCompare(b.title); });
    timelinePane.innerHTML = '<div class="mode-panel pane-scroll">' +
      '<div class="place-directory-header"><div><div class="mode-eyebrow">Place directory</div><h2>All places</h2><p class="subtitle" style="margin:2px 0 0">Search, filter and jump straight to a location.</p></div><span class="directory-stats">' + places.length + ' unique places</span></div>' +
      '<div class="map-mode-toolbar" style="margin-top:14px">' +
        '<input id="places-search" type="search" placeholder="Search places…" value="' + escapeHtml(state.mapSearchQuery) + '" autocomplete="off">' +
        '<select id="places-country"><option value="all">All countries</option><option>Singapore</option><option>Malaysia</option></select>' +
        '<select id="places-city"><option value="all">All cities</option><option>Singapore</option><option>Kuala Lumpur</option><option>Melaka</option><option>Johor Bahru</option></select>' +
        '<select id="places-type"><option value="all">All types</option><option>food</option><option>attraction</option><option>nature</option><option>hotel</option><option>shopping</option><option>transport</option></select>' +
        '<select id="places-sort"><option value="day">Sort: Day</option><option value="time">Sort: Time</option><option value="name">Sort: Name</option></select>' +
      '</div>' +
      '<div class="place-list" id="places-list">' + places.map(renderPlaceListItem).join("") + '</div></div>';
    const country = document.getElementById("places-country");
    const city = document.getElementById("places-city");
    const type = document.getElementById("places-type");
    const sort = document.getElementById("places-sort");
    const search = document.getElementById("places-search");
    function refresh(){
      const q=normalizeText(search.value), c=country.value, ci=city.value, ty=type.value, so=sort.value;
      const filtered=places.filter(function(p){
        const hay=normalizeText([p.title,p.city,p.country,p.type,(p.tags||[]).join(" ")].join(" "));
        return (!q||hay.includes(q)) && (c==="all"||p.country===c) && (ci==="all"||p.city===ci) && (ty==="all"||p.type===ty);
      }).slice().sort(function(a,b){
        if(so==="name") return a.title.localeCompare(b.title);
        if(so==="time") return String(a.start||"99:99").localeCompare(String(b.start||"99:99"));
        return (a.day-b.day) || ((a.sequence||0)-(b.sequence||0)) || a.title.localeCompare(b.title);
      });
      document.getElementById("places-list").innerHTML=filtered.map(renderPlaceListItem).join("") || '<div class="empty">No places match your filters.</div>';
    }
    [country,city,type,sort].forEach(function(el){ if(el) el.addEventListener("change",refresh); });
    if(search) search.addEventListener("input",refresh);
    renderMapTopbar("Place directory map", "Click a place to inspect it and focus the offline map.");
    renderOfflineMap(places.filter(function(p){return p.coordinates;}).flatMap(function(p){ return p.activities; }));
    ensureInspectorPane();
    renderPlaceInspector(state.selectedActivityId);
  }

  function renderPlaceListItem(place) {
    const a = place.selectedActivity || place.activities[0];
    const active = state.selectedActivityId === a.id;
    return '<button class="place-item' + (active ? " active" : "") + '" type="button" data-action="place-select" data-activity="' + escapeHtml(a.id) + '">' +
      '<div class="place-item-top"><span class="place-number">' + escapeHtml(a.daySequenceLabel || ("D"+a.day+" · "+String(a.sequence||1).padStart(2,"0"))) + '</span><span class="place-chip accent">' + escapeHtml(place.type) + '</span></div>' +
      '<strong>' + escapeHtml(place.title) + '</strong>' +
      '<small>' + escapeHtml([place.city,place.country].filter(Boolean).join(" · ")) + '</small>' +
      '<div class="place-chip-row">' + (place.start ? '<span class="place-chip">' + escapeHtml(place.start) + (place.end ? "–"+escapeHtml(place.end) : "") + '</span>' : "") + (place.tags||[]).slice(0,3).map(function(tag){return '<span class="place-chip">#'+escapeHtml(tag)+'</span>';}).join("") + '</div>' +
    '</button>';
  }

  function renderPlaceInspector(id) {
    const pane = document.getElementById("place-inspector-pane");
    if (!pane) return;
    const activity = getActivityById(id) || (mapFilteredActivities()[0] || placeActivities()[0] || null);
    if (!activity) { pane.innerHTML = '<div class="mode-panel empty">No place selected.</div>'; return; }
    state.selectedActivityId = activity.id; state.selectedPlaceId = activity.id; mapState.selectedActivityId = activity.id;
    const index = allActivities().findIndex(function(a){ return a.id===activity.id; });
    const previous = index > 0 ? allActivities()[index-1] : null;
    const next = index >=0 ? allActivities()[index+1] : null;
    const place = richPlaceData[activity.location] || {};
    const image = safeUrl(activity.imageUrl,"image");
    const highlights = (activity.highlights||[]).length ? '<div class="inspector-section"><h4>Highlights</h4><ul class="bullet-list">' + activity.highlights.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join("") + '</ul></div>' : "";
    const tips = (activity.tips||[]).length ? '<div class="inspector-section"><h4>Tips</h4><ul class="bullet-list">' + activity.tips.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join("") + '</ul></div>' : "";
    const actions = '<div class="modal-actions"><button class="button primary" type="button" data-action="details" data-activity="'+escapeHtml(activity.id)+'">Details</button>' +
      (safeMapsUrl(activity.mapsUrl) ? '<button class="button" type="button" data-action="open-maps-preview" data-activity="'+escapeHtml(activity.id)+'">Google Maps</button>' : "") +
      '<button class="button soft" type="button" data-action="focus-place" data-activity="'+escapeHtml(activity.id)+'">Focus</button></div>';
    pane.innerHTML = '<section class="inspector-card">' +
      (image ? '<img class="inspector-media" src="'+escapeHtml(image)+'" alt="" onerror="this.remove()">' : "") +
      '<div class="inspector-body"><div class="mode-eyebrow">'+escapeHtml(activity.daySequenceLabel || ("Day "+activity.day))+'</div><h2 class="inspector-title">'+escapeHtml(activityLabel(activity))+'</h2><p class="inspector-location">⌖ '+escapeHtml(locationLabel(activity))+' · '+escapeHtml(activity.city || "")+'</p>' +
      '<div class="inspector-meta"><span class="pill type">'+escapeHtml(activity.category || typeLabel(activity))+'</span><span class="pill">'+escapeHtml(activity.start||"Time TBD")+' – '+escapeHtml(activity.end||"")+'</span>' + (Number.isFinite(Number(activity.cost)) ? '<span class="pill">'+escapeHtml(formatMoney(activity.cost))+'</span>' : "") + '</div>' +
      (activity.shortDescription || activity.description ? '<div class="inspector-section"><h4>Overview</h4><p style="margin:0">'+escapeHtml(activity.shortDescription || activity.description)+'</p></div>' : "") +
      highlights + tips +
      '<div class="inspector-section"><h4>Visit information</h4>' +
        (activity.openingHours ? '<p class="note"><b>Opening hours:</b> '+escapeHtml(activity.openingHours)+'</p>' : '') +
        (activity.bestTime ? '<p class="note"><b>Best time:</b> '+escapeHtml(activity.bestTime)+'</p>' : '') +
        '<p class="note"><b>Estimated visit:</b> '+escapeHtml(formatMinutes(activity.estimatedVisitTime||getActivityDuration(activity)))+'</p>' +
      '</div>' +
      (activity.address ? '<div class="inspector-section"><h4>Location</h4><p style="margin:0">'+escapeHtml(activity.address)+'</p>' + (getActivityCoordinates(activity) ? '<p class="location" style="margin-top:5px">'+activity.coordinates.lat.toFixed(4)+', '+activity.coordinates.lng.toFixed(4)+'</p>' : '') + '</div>' : '') +
      (activity.transport ? '<div class="inspector-section"><h4>Next move</h4><div class="transport-detail"><div class="transport-detail-icon">'+transportIcon(activity.transport.mode)+'</div><div><strong>'+escapeHtml(activity.transport.mode)+'</strong><span>'+escapeHtml(formatMinutes(activity.transport.duration))+' · '+escapeHtml(activity.transport.distance||"Distance unavailable")+'</span></div><button class="mini-button" type="button" data-action="transport-details" data-activity="'+escapeHtml(activity.id)+'">View</button></div></div>' : '') +
      '<div class="inspector-section"><h4>Trip context</h4>' +
        '<p class="note"><b>Previous:</b> '+escapeHtml(previous ? locationLabel(previous) : "No previous stop")+'</p>' +
        '<p class="note"><b>Next:</b> '+escapeHtml(next ? locationLabel(next) : "No next stop")+'</p>' +
      '</div>' +
      actions +
      '<div class="inspector-nav"><button class="mini-button" type="button" data-action="modal-previous" data-activity="'+escapeHtml(activity.id)+'">← Previous</button><button class="mini-button" type="button" data-action="modal-next" data-activity="'+escapeHtml(activity.id)+'">Next →</button></div>' +
      '</div></section>';
  }

  function focusPlaceOnMap(id) {
    const activity=getActivityById(id);
    if(!activity) return;
    state.selectedActivityId=id; state.selectedPlaceId=id; mapState.selectedActivityId=id;
    if(state.activeView==="itinerary") { state.activeView="map"; state.mapDay=state.selectedDay; renderCurrentEnhancedView(false); }
    renderPlaceInspector(id);
    centerMapOnActivity(activity, Math.max(mapState.zoom,3.2));
    renderOfflineMap(mapFilteredActivities().length ? mapFilteredActivities() : visibleActivities());
    requestAnimationFrame(function(){
      const card=document.querySelector('[data-activity-card="'+CSS.escape(id)+'"]');
      if(card) card.scrollIntoView({behavior:"smooth",block:"center"});
    });
  }

  function showRouteSegment(fromId, toId) {
    const from=getActivityById(fromId), to=getActivityById(toId);
    if(!from||!to) return;
    mapState.selectedRoute={fromId:fromId,toId:toId};
    mapState.selectedActivityId=toId;
    state.selectedActivityId=toId;
    renderOfflineMap(state.activeView==="itinerary"?visibleActivities():mapFilteredActivities());
    showToast((from.transport && from.transport.mode ? from.transport.mode : "Route") + " · " + (from.transport && from.transport.duration ? formatMinutes(from.transport.duration) : "direct") + " · " + ((from.transport && from.transport.distance) || "distance unavailable"));
    const preview=document.getElementById("map-route-card");
    if(preview) {
      preview.innerHTML = '<div class="route-card"><div class="mode-eyebrow">'+escapeHtml((from.transport&&from.transport.mode)||"Route")+'</div><div class="route-nodes"><div class="route-node"><strong>'+escapeHtml(locationLabel(from))+'</strong><small>'+escapeHtml(from.start||"")+'</small></div><span class="route-arrow">→</span><div class="route-node"><strong>'+escapeHtml(locationLabel(to))+'</strong><small>'+escapeHtml(to.start||"")+'</small></div></div><div class="pills"><span class="pill">◷ '+escapeHtml(formatMinutes(from.transport&&from.transport.duration))+'</span><span class="pill">'+escapeHtml((from.transport&&from.transport.distance)||"Distance unavailable")+'</span></div><button class="mini-button" type="button" data-action="details" data-activity="'+escapeHtml(to.id)+'">View Destination</button></div>';
    }
  }

  function openTransportDetails(activityId) {
    const from=getActivityById(activityId);
    if(!from || !from.transport) return;
    const all=allActivities(), idx=all.findIndex(function(x){return x.id===activityId;}), to=idx>=0?all[idx+1]:null;
    const modal=document.getElementById("activity-modal");
    modal.innerHTML='<header class="modal-header"><div><p class="eyebrow">Transport details</p><h2 id="modal-title">'+escapeHtml(from.transport.mode||"Transfer")+'</h2></div><button class="icon-button" type="button" data-action="modal-close" aria-label="Close transport details">×</button></header>' +
      '<div class="modal-body"><div class="transport-detail"><div class="transport-detail-icon">'+transportIcon(from.transport.mode)+'</div><div><strong>'+escapeHtml(locationLabel(from))+'</strong><span>From</span></div><div>→</div></div>' +
      (to ? '<div class="transport-detail" style="margin-top:8px"><div class="transport-detail-icon">⌖</div><div><strong>'+escapeHtml(locationLabel(to))+'</strong><span>To</span></div><div></div></div>' : '') +
      '<div class="modal-grid" style="margin-top:12px"><div><small>Mode</small>'+escapeHtml(from.transport.mode||"Not specified")+'</div><div><small>Duration</small>'+escapeHtml(formatMinutes(from.transport.duration))+'</div><div><small>Distance</small>'+escapeHtml(from.transport.distance||"Not specified")+'</div><div><small>Note</small>'+escapeHtml(from.transport.note||"")+'</div></div>' +
      (to ? '<div class="modal-actions"><button class="button primary" type="button" data-action="focus-place" data-activity="'+escapeHtml(to.id)+'">View destination</button></div>' : '') +
      '</div>';
    runtime.lastFocused=document.activeElement;
    document.getElementById("modal-backdrop").hidden=false;
    document.body.style.overflow="hidden";
    const close=modal.querySelector('[data-action="modal-close"]'); if(close) close.focus();
  }

  function renderActivityCard(activity, dayActivities) {
    const icon=activityIcons[typeLabel(activity)]||"●";
    const isExpanded=state.expandedActivities.has(activity.id);
    const active=state.selectedActivityId===activity.id;
    const image=imageMarkup(activity,true);
    const duration=getActivityDuration(activity), attachments=a(activity);
    const dayIndex=dayActivities.findIndex(function(x){return x.id===activity.id;});
    const previous=dayIndex>0?dayActivities[dayIndex-1]:null;
    const next=dayIndex>=0?dayActivities[dayIndex+1]:null;
    return '<div class="activity-wrap"><time class="time-pin" datetime="'+escapeHtml(activity.date+"T"+(activity.start||"00:00"))+'">'+escapeHtml(activity.start||"Time TBD")+'</time>' +
      '<article class="activity-card'+(isExpanded?" expanded":"")+(active?" active":"")+'" data-activity-card="'+escapeHtml(activity.id)+'" tabindex="0" aria-label="Open details for '+escapeHtml(activityLabel(activity))+'">' +
      image + '<div class="card-top"><div class="activity-icon" aria-hidden="true">'+icon+'</div><div class="activity-title"><h3>'+escapeHtml(activityLabel(activity))+'</h3><p class="location">⌖ '+escapeHtml(locationLabel(activity))+' · '+escapeHtml(activity.city||"")+'</p><div class="pills"><span class="pill type">'+escapeHtml(activity.category||typeLabel(activity))+'</span>' +
      (duration?'<span class="pill">◷ '+escapeHtml(formatMinutes(duration))+'</span>':"") + (Number.isFinite(Number(activity.cost))?'<span class="pill">'+escapeHtml(formatMoney(activity.cost))+'</span>':"") +
      (attachments.length?'<span class="pill">📎 '+attachments.length+'</span>':"") + '</div></div><div class="card-actions">' +
      '<button class="mini-button" type="button" data-action="toggle-card" data-activity="'+escapeHtml(activity.id)+'" aria-expanded="'+String(isExpanded)+'">'+(isExpanded?"Less":"More")+'</button>' +
      '<button class="mini-button" type="button" data-action="details" data-activity="'+escapeHtml(activity.id)+'">Details</button>' +
      '<button class="mini-button" type="button" data-action="focus-place" data-activity="'+escapeHtml(activity.id)+'">Map</button>' +
      (safeMapsUrl(activity.mapsUrl)?'<button class="mini-button" type="button" data-action="open-maps-preview" data-activity="'+escapeHtml(activity.id)+'">Maps</button>':"") +
      '</div></div>' +
      (activity.shortDescription||activity.description?'<p class="card-description">'+escapeHtml(activity.shortDescription||activity.description)+'</p>':"") +
      '<div class="activity-extra"><div class="detail-grid">' +
      (activity.address?'<div><b>Address</b>'+escapeHtml(activity.address)+'</div>':"") +

      '</div>'+(activity.notes?'<p class="note"><b>Note:</b> '+escapeHtml(activity.notes)+'</p>':"") +
      (next?'<p class="note"><b>Next stop:</b> '+escapeHtml(locationLabel(next))+'</p>':"") + '</div></article>' +
      (activity.transport ? '<button class="transport-card" type="button" data-action="transport-details" data-activity="'+escapeHtml(activity.id)+'"><span aria-hidden="true">'+transportIcon(activity.transport.mode)+'</span><span><strong>'+escapeHtml(activity.transport.mode)+'</strong> · '+escapeHtml(activity.transport.note||"Direct route")+'<br><small>'+escapeHtml(formatMinutes(activity.transport.duration))+' · '+escapeHtml(activity.transport.distance||"Distance unavailable")+'</small></span><span>Details →</span></button>' : '') +
